name: AEOS contract gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: AEOS contract and compatibility gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
