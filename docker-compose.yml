version: '3.8'
services:
  sales-service-system:
    build: .
    container_name: sales-service-system
    ports:
      - "3010:3010"
    volumes:
      - ./database:/app/database
      - ./uploads:/app/uploads
    environment:
      - PORT=3010
      - NODE_ENV=production
      - TZ=Asia/Shanghai
    restart: unless-stopped
