version: '3.8'
services:
  ebms:
    image: ebms:latest
    container_name: ebms
    ports:
      - "3010:3010"
    volumes:
      - ./database:/app/database
      - ./uploads:/app/uploads
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    environment:
      - PORT=3010
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - EBMS_APP_KEY=${EBMS_APP_KEY}
      - EBMS_APP_SECRET=${EBMS_APP_SECRET}
      - EBMS_EXTERNAL_API_KEY=${EBMS_EXTERNAL_API_KEY}
    restart: unless-stopped
