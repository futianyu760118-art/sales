<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>企业经营管理平台（EBMS）-HJ - 样品管理</title><link rel="stylesheet" href="common.css">
<style>
.sb{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.sb input,.sb select{padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
th{background:#f5f6fa;padding:9px 8px;text-align:left;font-weight:600;color:#555;border-bottom:2px solid #eee;white-space:nowrap;position:sticky;top:0}
td{padding:7px 8px;border-bottom:1px solid #f0f0f0;vertical-align:top}
tr:hover td{background:#f8f9ff}
.btn{padding:7px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.b1{background:#667eea;color:#fff}.b2{background:#27ae60;color:#fff}.b3{background:#e74c3c;color:#fff}.b4{background:#f39c12;color:#fff}
.bs{padding:3px 8px;font-size:11px}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.sc{background:#fff;padding:12px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.06);text-align:center}
.sc .n{font-size:22px;font-weight:700;color:#667eea}.sc .l{font-size:11px;color:#999;margin-top:2px}
.em{text-align:center;color:#999;padding:30px}
.mo{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:flex-start;padding-top:20px}.mo.ac{display:flex}
.mb2{background:#fff;border-radius:12px;padding:20px;width:520px;max-width:95%;max-height:90vh;overflow:auto}
.fg{margin-bottom:8px}.fg label{display:block;font-size:12px;color:#666;margin-bottom:3px}
.fg input,.fg select,.fg textarea{width:100%;padding:6px 8px;border:1px solid #ddd;border-radius:4px;font-size:13px}
.fg textarea{resize:vertical;min-height:50px}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.st-pending{background:#fff3cd;color:#856404}.st-confirmed{background:#d1ecf1;color:#0c5460}.st-producing{background:#cce5ff;color:#004085}
.st-sent{background:#d4edda;color:#155724}.st-customer{background:#e8daef;color:#76448a}.st-completed{background:#d5f5e3;color:#1e8449}
.tbl-wrap{overflow-x:auto;max-height:65vh;overflow-y:auto}
.ord-link{color:#667eea;text-decoration:none;font-weight:600}
.ord-link:hover{text-decoration:underline}
.ord-stat{display:inline-block;padding:1px 6px;border-radius:8px;font-size:11px;background:#f0f4ff;color:#4a5dc8;margin-right:3px}
.ord-amt{font-weight:600;color:#2c7a4b}
.ord-empty{color:#bbb;font-size:11px}
</style><script src="fetch-auth.js"></script></head><body data-page-title="样品管理" data-page-perm="sample:view">
<div class="sidebar" id="sidebar"></div>
<div class="main-content">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
<h2>样品管理</h2>
<button class="btn b2" onclick="openAdd()">新增样品</button>
</div>
<div class="sg" id="sStats"></div>
<div class="sb">
<input type="text" id="sKw" placeholder="搜索编号/客户/产品" style="width:220px" onkeydown="if(event.key==='Enter')loadList(1)">
<select id="sStatus"><option value="">全部状态</option><option value="pending">待确认</option><option value="confirmed">已确认</option><option value="producing">生产中</option><option value="sent">已发出</option><option value="customer_confirmed">客户已确认</option><option value="completed">已完成</option></select>
<input type="text" id="sInquiry" placeholder="询价单号" style="width:140px">
<button class="btn b1" onclick="loadList(1)">搜索</button>
<span style="margin-left:auto">共 <b id="sTc">0</b> 条</span>
</div>
<div class="tbl-wrap">
<table><thead><tr>
<th>样品编号</th><th>客户</th><th>询价单号</th><th>产品名称</th><th>产品代码</th><th>数量</th><th>类型</th><th>状态</th><th>发出日期</th><th>确认日期</th><th>关联订单（审核台）</th><th>操作</th>
</tr></thead><tbody id="sTb"><tr><td colspan="12" class="em">暂无数据</td></tr></tbody></table>
</div>
<div id="sPg" style="margin-top:12px;text-align:center"></div>
</div>

<!-- 新增/编辑弹窗 -->
<div class="mo" id="gMo"><div class="mb2" id="gMoBox"></div></div>

<script>
const API='/api/samples';
const ORDER_API='/api/order-analysis';
const statusMap={pending:'待确认',confirmed:'已确认',producing:'生产中',sent:'已发出',customer_confirmed:'客户已确认',completed:'已完成'};
const statusCls={pending:'st-pending',confirmed:'st-confirmed',producing:'st-producing',sent:'st-sent',customer_confirmed:'st-customer',completed:'st-completed'};
const rvMap={pending:'待审核',reviewing:'审核中',approved:'已通过',rejected:'已驳回',none:'未提交'};

// 客户 → 关联订单聚合（缓存：loadList 时拉一次；切换筛选重新拉）
// { [customerName]: {count, amount, latestRv, latestOrderNo, latestOrderId, ids:[...]} }
let orderByCustomer = {};
let orderByInquiryNo = {};
let _orderLoadToken = 0;

function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmtMoney(n){var v=Math.round((Number(n)||0)*100)/100;return '¥'+v.toLocaleString()}

async function loadStats(){
  try{
    const r=await fetch(API+'/stats');const d=await r.json();
    document.getElementById('sStats').innerHTML=`
      <div class="sc"><div class="n">${d.total||0}</div><div class="l">样品总数</div></div>
      <div class="sc"><div class="n" style="color:#f39c12">${d.pending||0}</div><div class="l">待确认</div></div>
      <div class="sc"><div class="n" style="color:#3498db">${d.producing||0}</div><div class="l">生产中</div></div>
      <div class="sc"><div class="n" style="color:#27ae60">${d.sent||0}</div><div class="l">已发出</div></div>
      <div class="sc"><div class="n" style="color:#76448a">${d.customer_confirmed||0}</div><div class="l">客户已确认</div></div>
      <div class="sc"><div class="n" style="color:#1e8449">${d.completed||0}</div><div class="l">已完成</div></div>
    `;
  }catch(e){console.error(e)}
}

// 从订单分析库（审核台）拉所有订单，按客户名/询价号建立索引，供样品列表关联展示
// 增量：limit 9999 覆盖现有数据规模；网络失败不影响样品列表主流程
async function loadRelatedOrders(token){
  try{
    const r=await fetch(ORDER_API+'?limit=9999&sort_by=created_at&sort_order=DESC');
    if(!r.ok) return;
    const d=await r.json();
    if(token!==_orderLoadToken) return; // 过期
    const byCust={}, byInq={};
    (d.data||[]).forEach(o=>{
      const cn=String(o.customer_name||'').trim();
      const amt=Number(o.order_amount)||0;
      const rv=o.review_status||'none';
      if(cn){
        if(!byCust[cn]) byCust[cn]={count:0,amount:0,latestRv:rv,latestOrderNo:o.order_no,latestOrderId:o.id,ids:[]};
        const g=byCust[cn];
        g.count++;
        g.amount+=amt;
        g.ids.push(o.id);
        // 用最早创建/最大ID的订单作为 latest（已按 created_at DESC 取，后到优先）
      }
      // 注：订单分析库无 inquiry_no 字段，无法按询价号直接关联；此处仅做客户维度聚合
    });
    orderByCustomer=byCust;
    orderByInquiryNo=byInq;
  }catch(e){console.warn('关联订单加载失败（不影响样品列表）',e.message)}
}

async function loadList(page){
  sPage=page||1;
  const p=new URLSearchParams({page:sPage,limit:(window._pageSize||50)});
  const kw=document.getElementById('sKw').value,st=document.getElementById('sStatus').value,iq=document.getElementById('sInquiry').value;
  if(kw)p.set('keyword',kw);if(st)p.set('status',st);if(iq)p.set('inquiry_no',iq);
  // 拉样品前先触发关联订单索引拉取，渲染前会再次等待一次
  const token=++_orderLoadToken;
  const orderPromise=loadRelatedOrders(token);
  try{
    const r=await fetch(API+'?'+p);const d=await r.json();
    const total=d.total||0;document.getElementById('sTc').textContent=total;
    const recs=d.data||[],tb=document.getElementById('sTb');
    if(!recs.length){tb.innerHTML='<tr><td colspan="12" class="em">暂无数据</td></tr>';renderPg('sPg',total,sPage,loadList);return}
    // 等关联订单索引就绪（最多 800ms，过期不阻塞渲染）
    await Promise.race([orderPromise, new Promise(res=>setTimeout(res,800))]);
    tb.innerHTML=recs.map(s=>{
      const cn=String(s.customer_name||'').trim();
      const g=orderByCustomer[cn];
      let ordCell='<span class="ord-empty">无</span>';
      if(g&&g.count){
        const rvLabel=rvMap[g.latestRv]||'未提交';
        const rvColor=g.latestRv==='approved'?'#27ae60':(g.latestRv==='rejected'?'#e74c3c':(g.latestRv==='pending'||g.latestRv==='reviewing'?'#f39c12':'#888'));
        ordCell=`<a class="ord-link" href="order-analysis.html?order_id=${g.latestOrderId}" title="查看该客户关联订单">${esc(g.latestOrderNo||'-')}</a>`+
                 ` <span class="ord-stat">${g.count} 单</span>`+
                 ` <span class="ord-amt">${fmtMoney(g.amount)}</span>`+
                 ` <span style="font-size:10px;color:${rvColor}">[${rvLabel}]</span>`;
      }
      return `<tr>
      <td><b>${esc(s.sample_no||'-')}</b></td>
      <td>${esc(s.customer_name||'-')}</td>
      <td>${esc(s.inquiry_no||'-')}</td>
      <td>${esc((s.product_name||'').substring(0,18))}</td>
      <td>${esc(s.product_code||'-')}</td>
      <td>${s.quantity||0}</td>
      <td>${esc(s.sample_type||'-')}</td>
      <td>
        <span class="badge ${statusCls[s.status]||''}">${statusMap[s.status]||s.status||'-'}</span>
        <select style="margin-left:4px;padding:1px 3px;font-size:11px;border:1px solid #ddd;border-radius:3px" onchange="changeStatus(${s.id},this.value)">
          <option value="">改状态</option>
          ${Object.entries(statusMap).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}
        </select>
      </td>
      <td>${esc(s.send_date||'-')}</td>
      <td>${esc(s.confirm_date||'-')}</td>
      <td>${ordCell}</td>
      <td style="white-space:nowrap">
        <button class="btn bs b4" onclick="openEdit(${s.id})">编辑</button>
        <button class="btn bs b3" onclick="delItem(${s.id})">删除</button>
      </td>
    </tr>`;}).join('');
    renderPg('sPg',total,sPage,loadList);
  }catch(e){console.error(e)}
}

function renderPg(elId,total,page,fn){
  var ps = (window._pageSize || 50),pages=Math.ceil(total/ps),el=document.getElementById(elId);
  if(pages<=1){el.innerHTML='';return}
  let h='';
  if(page>1)h+=`<button class="btn bs" onclick="${fn.name}(${page-1})">上一页</button> `;
  for(let i=Math.max(1,page-2);i<=Math.min(pages,page+2);i++)h+=`<button class="btn bs ${i===page?'b1':''}" onclick="${fn.name}(${i})">${i}</button> `;
  if(page<pages)h+=`<button class="btn bs" onclick="${fn.name}(${page+1})">下一页</button>`;
  el.innerHTML=h;
}

async function changeStatus(id,newStatus){
  if(!newStatus)return;
  try{
    await fetch(API+'/'+id+'/status',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:newStatus})});
    loadList(sPage);loadStats();
  }catch(e){alert('状态更新失败')}
}

function openAdd(){
  const fields=[
    ['sample_no','样品编号','text'],['customer_name','客户名称*','text'],['inquiry_no','询价单号','text'],
    ['product_name','产品名称','text'],['product_code','产品代码','text'],
    ['quantity','数量','number'],['sample_type','样品类型','text'],
    ['status','状态','select:pending,confirmed,producing,sent,customer_confirmed,completed'],
    ['send_date','发出日期','date'],['confirm_date','确认日期','date'],
    ['remarks','备注','textarea']
  ];
  openForm('新增样品',fields,{status:'pending'},async(data)=>{
    if(!data.customer_name){alert('客户名称必填');return}
    data.quantity=Number(data.quantity)||0;
    await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    document.getElementById('gMo').classList.remove('ac');
    loadList(1);loadStats();
  });
}

async function openEdit(id){
  try{
    const r=await fetch(API+'/'+id);const s=await r.json();
    const fields=[
      ['sample_no','样品编号','text'],['customer_name','客户名称*','text'],['inquiry_no','询价单号','text'],
      ['product_name','产品名称','text'],['product_code','产品代码','text'],
      ['quantity','数量','number'],['sample_type','样品类型','text'],
      ['status','状态','select:pending,confirmed,producing,sent,customer_confirmed,completed'],
      ['send_date','发出日期','date'],['confirm_date','确认日期','date'],
      ['remarks','备注','textarea']
    ];
    openForm('编辑样品',fields,s,async(data)=>{
      if(!data.customer_name){alert('客户名称必填');return}
      data.quantity=Number(data.quantity)||0;
      await fetch(API+'/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
      document.getElementById('gMo').classList.remove('ac');
      loadList(sPage);loadStats();
    });
  }catch(e){alert('加载失败')}
}

async function delItem(id){
  if(!confirm('确定删除此样品记录？'))return;
  await fetch(API+'/'+id,{method:'DELETE'});
  loadList(sPage);loadStats();
}

function openForm(title,fields,data,onSave){
  const box=document.getElementById('gMoBox');
  let html=`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h3>${title}</h3><span onclick="document.getElementById('gMo').classList.remove('ac')" style="cursor:pointer;font-size:22px;color:#999">×</span></div>`;
  html+='<div style="max-height:60vh;overflow-y:auto;padding-right:6px">';
  let i=0;
  while(i<fields.length){
    const [key,label,type]=fields[i];
    if(type==='textarea'){
      html+=`<div class="fg"><label>${label}</label><textarea id="ff_${key}">${data[key]||''}</textarea></div>`;
      i++;
    }else{
      const next=fields[i+1];
      if(next&&next[2]!=='textarea'){
        html+='<div class="gr">';
        html+=renderField(fields[i],data);
        html+=renderField(next,data);
        html+='</div>';
        i+=2;
      }else{
        html+='<div class="gr">';
        html+=renderField(fields[i],data);
        html+='</div>';
        i++;
      }
    }
  }
  html+='</div>';
  html+='<div style="text-align:right;margin-top:12px"><button class="btn b2" id="ffSave">保存</button></div>';
  box.innerHTML=html;
  document.getElementById('gMo').classList.add('ac');
  document.getElementById('ffSave').onclick=()=>{
    const d={};
    fields.forEach(([key,,type])=>{
      const el=document.getElementById('ff_'+key);
      if(!el)return;
      d[key]=type==='number'?Number(el.value)||0:el.value;
    });
    onSave(d);
  };
}

function renderField([key,label,type],data){
  const val=data[key]||'';
  if(type.startsWith('select:')){
    const opts=type.substring(7).split(',');
    return `<div class="fg"><label>${label}</label><select id="ff_${key}">${opts.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select></div>`;
  }
  return `<div class="fg"><label>${label}</label><input type="${type==='number'?'number':type==='date'?'date':'text'}" id="ff_${key}" value="${val}"></div>`;
}

loadStats();
loadList(1);
</script>
<script src="chat-widget.js"></script>
<script src="brand.js"></script>
<script src="common.js"></script>

<script src="permission-check.js"></script><script>PermissionCheck.init();</script>
<script src="data-scope.js"></script><script>window.DataScope && window.DataScope.load().then(()=>{try{window.DataScope.renderBanner('.search-bar');}catch(e){}});</script>
</body></html>
