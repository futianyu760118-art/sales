<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>阿米巴经营管理 - 降本攻坚</title><link rel="stylesheet" href="common.css">
<style>
.ap-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.ap-top h2{margin:0}
.ym-box{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ym-box input,.ym-box select{padding:7px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px}
.ym-box input[type=number]{width:90px}
.tabs{display:flex;gap:4px;margin-bottom:14px;overflow-x:auto;border-bottom:2px solid #eee}
.tabs button{border:none;background:none;padding:10px 14px;white-space:nowrap;cursor:pointer;color:#666;font-size:13px}
.tabs button.ac{color:#667eea;border-bottom:2px solid #667eea;font-weight:700}
.tc{display:none}.tc.ac{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.cardx{background:#fff;border-radius:10px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.cardx .n{font-size:24px;font-weight:800;color:#667eea}
.cardx .l{font-size:12px;color:#888;margin-top:4px}
.dash{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px}
.panel{background:#fff;border-radius:10px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);min-height:200px}
.panel h3{font-size:14px;margin:0 0 10px;color:#333}
.ring{width:150px;height:150px;border-radius:50%;margin:6px auto;display:flex;align-items:center;justify-content:center}
.ring .inner{background:#fff;width:104px;height:104px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .inner b{font-size:26px;font-weight:800;color:#333}
.ring .inner span{font-size:11px;color:#999}
.sb{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.sb input,.sb select{padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px}
.tbl{overflow:auto;background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);max-height:64vh}
.tbl table{width:100%;border-collapse:collapse}
.tbl th,.tbl td{padding:9px 11px;text-align:left;border-bottom:1px solid #eee;font-size:13px}
.tbl th{background:#f8f9fa;font-weight:600;color:#666;white-space:nowrap}
.tbl tr:hover{background:#f8f9ff}
.tbl td.em{text-align:center;color:#bbb;padding:24px}
.mo{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.45);justify-content:center;align-items:flex-start;z-index:1000;padding-top:36px}
.mo.ac{display:flex}
.mb{background:#fff;padding:22px;border-radius:12px;width:92%;max-width:640px;max-height:82vh;overflow-y:auto}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg{margin-bottom:10px}
.fg label{display:block;margin-bottom:4px;color:#555;font-weight:500;font-size:13px}
.fg input,.fg select,.fg textarea{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px}
.fg textarea{min-height:60px;resize:vertical}
.btn{padding:8px 14px;border:none;border-radius:6px;cursor:pointer;font-weight:500;font-size:13px;color:#fff;background:#999}
.btn:hover{opacity:.85}
.b1{background:#667eea}.b2{background:#27ae60}.b3{background:#e74c3c}.b4{background:#f39c12}.b5{background:#3498db}.bs{padding:5px 10px;font-size:12px}
.badge{padding:3px 8px;border-radius:12px;font-size:11px;white-space:nowrap;display:inline-block;color:#fff}
.badge.green{background:#27ae60}.badge.yellow{background:#f1c40f;color:#7a6400}.badge.orange{background:#e67e22}.badge.red{background:#e74c3c}.badge.blue{background:#3498db}.badge.gray{background:#95a5a6}
.warn td{color:#e67e22}
/* 树 */
.tree{list-style:none;padding-left:0}
.tree ul{list-style:none;padding-left:20px;border-left:1px dashed #e0e0e0;margin-left:6px}
.tree li{padding:6px 8px;margin:2px 0;border-radius:6px;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tree li:hover{background:#f8f9ff}
.tree .lv1{font-weight:600}.tree .lv2{color:#555}
.tree .tag{font-size:10px;padding:2px 6px;border-radius:8px;background:#eef1ff;color:#667eea}
/* 图表 */
.hbar-row{display:grid;grid-template-columns:90px 1fr 70px;gap:8px;align-items:center;margin:7px 0;font-size:12px}
.hbar{height:14px;background:#edf0f7;border-radius:7px;overflow:hidden}
.hbar i{display:block;height:100%;background:linear-gradient(90deg,#667eea,#764ba2);border-radius:7px}
.legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.legend span{display:flex;align-items:center;gap:5px;font-size:11px;color:#666}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.pie{width:170px;height:170px;border-radius:50%;margin:0 auto}
.flow-step{display:inline-block;padding:4px 12px;border-radius:6px;background:#f0f0f0;color:#888;font-size:12px;margin:0 4px}
.flow-step.on{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.arrow{color:#bbb}
.kpi-grade{font-weight:800;font-size:15px}
.kpi-grade.A{color:#27ae60}.kpi-grade.B{color:#667eea}.kpi-grade.C{color:#f39c12}.kpi-grade.D{color:#e74c3c}
/* 核算报表树状汇总 */
.stmt-row{background:#fff;border-radius:8px;margin-bottom:6px;box-shadow:0 1px 4px rgba(0,0,0,.05);overflow:hidden}
.stmt-lv1{border-left:4px solid #667eea}
.stmt-lv2{border-left:4px solid #9b59b6;margin-left:24px;background:#fafbff}
.stmt-head{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:13px;flex-wrap:wrap}
.stmt-head:hover{background:#f8f9ff}
.stmt-arrow{transition:transform .2s}
.stmt-name{margin-right:6px;color:#333}
.stmt-metrics{display:flex;flex-wrap:wrap;gap:10px;padding:0 14px 10px 36px;border-top:1px dashed #f0f0f0;background:#fcfcfc}
.stmt-m{display:flex;align-items:center;gap:4px;font-size:12px}
.stmt-m .lbl{color:#999}
.stmt-m b{font-weight:700}
.stmt-children{padding:4px 0}
@media(max-width:900px){.dash{grid-template-columns:1fr}.fr{grid-template-columns:1fr}.stmt-metrics{flex-direction:column;gap:4px;padding-left:14px}}
</style></head>
<body data-page-title="阿米巴经营管理" data-page-perm="amiba:view">
<div class="sidebar" id="sidebar"></div>
<div class="main-content" data-module="amiba">
  <div class="ap-top">
    <h2>阿米巴经营管理（降本攻坚）</h2>
    <div class="ym-box">
      <span>年度</span><input id="yearInput" type="number">
      <span>月份</span><select id="monthInput"><option value="">全年</option></select>
      <button class="btn b1" onclick="reloadCurrent()">刷新</button>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button class="ac" onclick="switchTab('dashboard')">经营驾驶舱</button>
    <button onclick="switchTab('org')">组织架构</button>
    <button onclick="switchTab('target')">降本目标</button>
    <button onclick="switchTab('account')">经营核算</button>
    <button onclick="switchTab('price')">内部定价</button>
    <button onclick="switchTab('standard')">收支标准</button>
    <button onclick="switchTab('trade')">交易明细</button>
    <button onclick="switchTab('value')">价值总表</button>
    <button onclick="switchTab('statement')">核算报表</button>
    <button onclick="switchTab('improve')">改善先锋</button>
    <button onclick="switchTab('dispute')">争议仲裁</button>
    <button onclick="switchTab('train')">培训激励</button>
    <button onclick="switchTab('report')">月度月报</button>
    <button onclick="switchTab('ext')">外部API</button>
  </div>
  <div class="tc ac" id="tab-dashboard"><div id="dashboardBox"></div></div>
  <div class="tc" id="tab-org"><div id="orgBox"></div></div>
  <div class="tc" id="tab-target"><div id="targetBox"></div></div>
  <div class="tc" id="tab-account"><div id="accountBox"></div></div>
  <div class="tc" id="tab-price"><div id="priceBox"></div></div>
  <div class="tc" id="tab-standard"><div id="standardBox"></div></div>
  <div class="tc" id="tab-trade"><div id="tradeBox"></div></div>
  <div class="tc" id="tab-value"><div id="valueBox"></div></div>
  <div class="tc" id="tab-statement"><div id="statementBox"></div></div>
  <div class="tc" id="tab-improve"><div id="improveBox"></div></div>
  <div class="tc" id="tab-dispute"><div id="disputeBox"></div></div>
  <div class="tc" id="tab-train"><div id="trainBox"></div></div>
  <div class="tc" id="tab-report"><div id="reportBox"></div></div>
  <div class="tc" id="tab-ext"><div id="extBox"></div></div>
</div>
<div class="mo" id="formModal"><div class="mb" id="formBox"></div></div>
<script src="common.js"></script>
<script>
const API='/api/amiba';
const Y=new Date().getFullYear();
let currentTab='dashboard';
let meta={amiba_types:[],improve_types:[],dispute_types:[],price_status:[],audit_status:[],project_status:[],amibas:[]};
let caches={};
document.getElementById('yearInput').value=Y;
(function(){for(let i=1;i<=12;i++){const o=document.createElement('option');o.value=i;o.textContent=i+'月';document.getElementById('monthInput').appendChild(o)}})();
function year(){return Number(document.getElementById('yearInput').value)||Y}
function month(){return document.getElementById('monthInput').value?Number(document.getElementById('monthInput').value):''}
function yuan(v){v=Number(v)||0;const a=Math.abs(v);if(a>=100000000)return (v/100000000).toFixed(2)+'亿';if(a>=10000)return (v/10000).toFixed(1)+'万';return Math.round(v).toLocaleString()}
function yuan2(v){return (Number(v)||0).toLocaleString(undefined,{maximumFractionDigits:2})}
function percent(v){return (Number(v)||0).toFixed(1).replace(/\.0$/,'')+'%'}
function badge(v){const t=String(v||'-');let c='blue';if(['已完成','已生效','已通过','已裁决','已签署','启用','试点中','执行中','A'].includes(t))c='green';if(['待审核','待初审','待终审','草稿','待处理','立项','B','执行'].includes(t))c='yellow';if(['执行中','审核中','C'].includes(t))c='orange';if(['已驳回','已失效','已终止','已停用','D'].includes(t))c='red';if(['待签'].includes(t))c='gray';return `<span class="badge ${c}">${esc(t)}</span>`}
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function applyPerms(){if(window.PermissionCheck)PermissionCheck.applyToPage()}
function tabName(n){return {dashboard:'经营驾驶舱',org:'组织架构',target:'降本目标',account:'经营核算',price:'内部定价',standard:'收支标准',trade:'交易明细',value:'价值总表',statement:'核算报表',improve:'改善先锋',dispute:'争议仲裁',train:'培训激励',report:'月度月报',ext:'外部API'}[n]}
// 各Tab操作流程与核算标准（不修改任何表头，仅作为说明面板注入Tab顶部）
const _TAB_INFO={
dashboard:{flow:'各模块录入数据 → 「经营核算」执行月度核算 → 「核算报表」生成各巴核算表 → 驾驶舱自动汇总展示',std:'降本达成率 = 实际节约额 ÷ 目标额；利润 = 总收入 − 总成本；累计降本 = 各巴已完成改善项目节约额之和'},
org:{flow:'新增巴单元（一级巴=部门/二级巴=班组） → 绑定巴长（取自「系统组织模块」真实人员） → 一级巴设置关联销售员（用于归集订单收入）',std:'巴长必须为系统组织架构中在职人员；关联销售员的订单自动归入该巴收入；停用的巴不参与核算'},
target:{flow:'设置公司年度降本总目标 → 「一键拆解」按权重分配到一级巴 → 各巴长签署电子责任状 → 月度跟踪达成率',std:'达成率 = 实际节约 ÷ 目标额；实际节约由「改善项目」结项数据自动汇总；达成率 < 80% 标红预警'},
account:{flow:'点击「月度自动核算」→ 系统按巴关联的部门/销售员自动归集订单收入与成本 → 可手工调整 → 保存',std:'利润 = 收入 −（材料+能耗+人工+管理费+内部交易+其他成本）；本期节约 =（上期单位成本 − 本期单位成本）× 本期收入'},
price:{flow:'从物料库检索取基数（物料代码/名称/单位/单价） → 设置系数 → 系统自动算内部单价（基数×系数） → 提交审核 → 审批通过后生效',std:'内部单价 = 物料库单价（基数）× 系数；审核流程：财务提交 → 推行办审核 → 委员会审批 → 生效后计入核算；支持 Excel 导入/导出'},
standard:{flow:'选择部门（巴）+ 方向（收入/支出） → 从物料库选物料（自动带出单价基数） → 设置系数 → 自动算标准价 → 可批量生成',std:'标准价 = 物料库单价 × 系数；标准金额 = 标准价 × 标准数量；收入标准=该巴对外提供服务收费；支出标准=该巴接受其他巴服务付费'},
trade:{flow:'选择提供方巴/接收方巴 → 填写服务编号 → 点「查询定价清单带价」自动带出单价 → 填数量 → 保存 → 点「结算」计入核算',std:'总金额 = 数量 × 单价；服务编号关联定价清单自动带价；仅「已结算」的交易计入经营核算与价值总表；可按巴切换子表查看'},
value:{flow:'交易明细结算后自动汇总 → 查看各部门价值排行 → 查看各经办人创造价值排行',std:'提供价值 = 作为提供方巴的交易总额（该部门创造的价值）；接收价值 = 作为接收方巴的交易总额（占用的成本）；净创造价值 = 提供价值 − 接收价值；正值=价值净输出部门'},
statement:{flow:'选择巴 → 点「生成」→ 收入行从交易明细按服务编号自动归集 → 手工填写费用行和总工时 → 点「保存」',std:'经营附加值 = 总收入 − 总费用；单位时间附加值 = 附加值 ÷ 总工时；净利润率 = 净利润 ÷ 总收入；阶梯奖励：利润率<10%→10%、10~20%→15%、≥20%→20%；奖金池 = 净利润 × 奖励比例（亏损为0）'},
improve:{flow:'提报改善项目 → 精益专员评审立项 → 执行中跟进进度 → 结项核算节约额 → 优秀项目归档为标杆案例',std:'节约额 = 上期成本 − 本期成本；结项后的节约额自动计入「降本目标」的实际达成；成本热力测绘按单位成本从高到低排列，识别改善潜力'},
dispute:{flow:'巴长提交争议（定价/成本/责任/结算） → 推行办初审 → 委员会终审 → 裁决结果写入核算基准',std:'定价争议：对内部单价有异议；成本争议：对成本归集有异议；终审通过后裁决金额调整核算数据'},
train:{flow:'记录培训场次（主题/类型/参加人数/完成人数） → 巴长能力考核 → 系统按经营成果测算激励奖金 → 自动同步巴长KPI',std:'激励奖金 = 累计降本节约额 × 提奖比例（默认20%）；巴长KPI = 目标达成率50% + 利润率30% + 改善项目贡献20%；KPI等级 A/B/C/D'},
report:{flow:'点击「一键生成本月月报」→ 系统自动汇总各巴经营数据生成月报内容 → 编辑补充 → 发布/归档',std:'月报汇总各巴当月核算数据、降本达成、改善成果、争议处理等；发布后可供委员会审阅'},
  ext:{flow:'外部系统（金蝶/WMS/MES）通过 X-API-Key 调用 /api/external/* → 拉取阿米巴数据(OUT)或回传应收应付(BACK) → 本系统自动归集到核算表',std:'应收(AR)金额按应收确认收入；应付(AP)金额按应付确认成本；BACK 回传自动加锁，后续 OUT 推送不再覆盖；所有调用记录在同步登记中可查'}
};
function _infoPanel(name){
  const info=_TAB_INFO[name];if(!info)return'';
  return `<details class="tab-info" style="background:linear-gradient(135deg,#f0f4ff,#e8eeff);border-left:4px solid #667eea;padding:8px 14px;margin-bottom:10px;border-radius:0 6px 6px 0;font-size:13px;color:#444;animation:fadeIn .2s">
    <summary style="cursor:pointer;font-weight:700;color:#667eea;user-select:none">📋 操作流程与核算标准 <span style="font-size:11px;color:#999;font-weight:400">（点击展开/收起）</span></summary>
    <div style="margin-top:8px;line-height:1.8">
      <div style="margin-bottom:4px"><span style="display:inline-block;background:#27ae60;color:#fff;padding:1px 8px;border-radius:10px;font-size:11px;margin-right:6px">操作流程</span>${esc(info.flow)}</div>
      <div><span style="display:inline-block;background:#e67e22;color:#fff;padding:1px 8px;border-radius:10px;font-size:11px;margin-right:6px">核算标准</span>${esc(info.std)}</div>
    </div>
  </details>`;
}
function switchTab(name){currentTab=name;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('ac',b.textContent.includes(tabName(name))));document.querySelectorAll('.tc').forEach(c=>c.classList.remove('ac'));const tabDiv=document.getElementById('tab-'+name);if(!tabDiv)return;tabDiv.classList.add('ac');const box=tabDiv.querySelector('[id$="Box"]');const old=tabDiv.querySelector('.tab-info');const panel=document.createElement('div');panel.innerHTML=_infoPanel(name);const first=panel.firstChild;if(old&&first){tabDiv.replaceChild(first,old)}else if(!old&&first&&box){tabDiv.insertBefore(first,box)}loadTab(name)}
function reloadCurrent(){loadTab(currentTab,true)}
async function getJson(url,opt){const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
async function postJson(url,body){return getJson(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})})}
async function putJson(url,body){return getJson(url,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})})}
async function delJson(url){return getJson(url,{method:'DELETE'})}
async function loadMeta(){try{meta=await getJson(`${API}/meta`)}catch(e){}}
async function loadTab(name,force){
  await loadMeta();
  if(name==='dashboard')return loadDashboard();
  if(name==='org')return loadOrg();
  if(name==='target')return loadTarget();
  if(name==='account')return loadAccount();
  if(name==='price')return loadPrice();
  if(name==='standard')return loadStandard();
  if(name==='trade')return loadTrade();
  if(name==='value')return loadValue();
  if(name==='statement')return loadStatement();
  if(name==='improve')return loadImprove();
  if(name==='dispute')return loadDispute();
  if(name==='train')return loadTrain();
  if(name==='report')return loadReport();
  if(name==='ext')return loadExt();
}
function renderTable(cols,rows,span){if(!rows||!rows.length)return `<div class="tbl"><table><tbody><tr><td class="em" colspan="${span}">暂无数据</td></tr></tbody></table></div>`;return `<div class="tbl"><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr${r._warn?' class="warn"':''}>${cols.map(c=>`<td>${c[1](r)??''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function openForm(){document.getElementById('formModal').classList.add('ac')}
function closeForm(){document.getElementById('formModal').classList.remove('ac')}
function field(f,row){let [k,l,t,opt]=f;let v=row?row[k]??'':'';if(t==='select'){const arr=(opt&&opt.length)?opt:(meta[k+'s']||[]);const srch=arr.length>30?' data-searchable="1"':'';return `<div class="fg"><label>${l}</label><select id="ff_${k}"${srch}>${arr.map(o=>{const val=typeof o==='object'?o.id:o;const txt=typeof o==='object'?o.name:o;return `<option value="${esc(val)}" ${String(v)===String(val)?'selected':''}>${esc(txt)}</option>`}).join('')}</select></div>`}if(t==='textarea')return `<div class="fg"><label>${l}</label><textarea id="ff_${k}">${esc(v)}</textarea></div>`;return `<div class="fg"><label>${l}</label><input id="ff_${k}" type="${t==='number'?'number':t==='date'?'date':'text'}" value="${esc(v)}"></div>`}
function formFields(fields,row){let h='<div>';for(let i=0;i<fields.length;i++){const a=fields[i],b=fields[i+1];if(a[2]==='textarea'){h+=field(a,row);continue}if(b&&b[2]!=='textarea'){h+='<div class="fr">'+field(a,row)+field(b,row)+'</div>';i++}else h+='<div class="fr">'+field(a,row)+'</div>'}return h+'</div>'}
function readForm(fields){const o={};fields.forEach(f=>{const el=document.getElementById('ff_'+f[0]);if(el)o[f[0]]=f[2]==='number'?(Number(el.value)||0):el.value});return o}

// 用法：exportExcel('/api/amiba/target/export?year=2026', '降本目标_2026.xlsx')
async function exportExcel(url, fallbackName){
  try{
    const r=await fetch(url,{headers:{'x-user-id':localStorage.getItem('currentUserId')||''}});
    if(!r.ok){const j=await r.json().catch(()=>({}));return alert('导出失败：'+(j.error||'HTTP '+r.status))}
    const blob=await r.blob();
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    // 尝试从 Content-Disposition 取文件名
    const cd=r.headers.get('Content-Disposition')||'';
    const m=cd.match(/filename\*?=(?:UTF-8'')?["']?([^";]+)/i);
    a.download= m?decodeURIComponent(m[1]) : (fallbackName||'export.xlsx');
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 500);
  }catch(e){alert('导出失败：'+e.message)}
}
async function importExcel(endpoint, fileInputId, onSuccess){
  const el=document.getElementById(fileInputId); if(!el||!el.files[0])return;
  const fd=new FormData(); fd.append('file', el.files[0]);
  try{
    const r=await fetch(endpoint,{method:'POST',headers:{'x-user-id':localStorage.getItem('currentUserId')||''},body:fd});
    const j=await r.json().catch(()=>({})); if(!r.ok)throw new Error(j.error||'HTTP '+r.status);
    const errTxt=j.errors&&j.errors.length?'\n部分错误：'+j.errors.slice(0,5).map(e=>'第'+e.row+'行: '+(e.errors||[]).join(';')).join('\n'):'';
    alert((j.message||'导入完成')+errTxt);
    if(typeof onSuccess==='function')onSuccess(); else location.reload();
  }catch(e){alert('导入失败：'+e.message)}
  el.value='';
}

function profitBars(list){if(!list.length)return '<div style="color:#bbb;font-size:12px;text-align:center;padding:30px 0">暂无核算数据，请先到「经营核算」执行月度核算</div>';const max=Math.max(1,...list.map(x=>Math.abs(x.value)));return list.map(x=>{const w=Math.abs(x.value)/max*100;const neg=x.value<0;return `<div class="hbar-row"><span>${esc(x.name)}</span><div class="hbar"><i style="width:${w}%;background:${neg?'linear-gradient(90deg,#e74c3c,#c0392b)':'linear-gradient(90deg,#667eea,#764ba2)'}"></i></div><b>${yuan(x.value)}</b></div>`}).join('')}
function costPie(list){const total=list.reduce((s,x)=>s+(Number(x.value)||0),0);if(!total)return '<div style="color:#bbb;font-size:12px;text-align:center;padding:30px 0">暂无成本数据</div>';const colors=['#667eea','#f39c12','#27ae60','#e74c3c','#9b59b6','#3498db'];let acc=0;let grad='';list.forEach((x,i)=>{const pct=(x.value/total)*360;grad+=`${colors[i%colors.length]} ${acc}deg ${acc+pct}deg`;acc+=pct;if(i<list.length-1)grad+=','});return `<div class="pie" style="background:conic-gradient(${grad})"></div><div class="legend">${list.map((x,i)=>`<span><i style="background:${colors[i%colors.length]}"></i>${esc(x.name)} ${percent(x.value/total*100)}</span>`).join('')}</div>`}
function trendSvg(t){const W=560,H=170,pad=28;const months=t;const mx=Math.max(1,...months.map(m=>Math.max(m.income,m.cost,Math.abs(m.profit))));const x=i=>pad+i*(W-pad*2)/11;const y=v=>H-pad-(v/mx)*(H-pad*2);const line=key=>{const pts=months.map((m,i)=>`${x(i)},${y(Math.max(0,m[key]))}`).join(' ');return `<polyline points="${pts}" fill="none" stroke="${key==='income'?'#27ae60':key==='cost'?'#e67e22':'#667eea'}" stroke-width="2"/>`};return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:180px">${[0.25,0.5,0.75,1].map(f=>`<line x1="${pad}" y1="${H-pad-f*(H-pad*2)}" x2="${W-pad}" y2="${H-pad-f*(H-pad*2)}" stroke="#eee"/>`).join('')}${line('income')}${line('cost')}${line('profit')}${months.map((m,i)=>i%2?'':`<text x="${x(i)}" y="${H-pad+14}" font-size="10" fill="#999" text-anchor="middle">${m.month}月</text>`).join('')}<g><circle cx="${x(0)}" cy="${y(0)}" r="0"/></g></svg><div class="legend"><span><i style="background:#27ae60"></i>收入</span><span><i style="background:#e67e22"></i>成本</span><span><i style="background:#667eea"></i>利润</span></div>`}
function cumulSvg(t){const W=560,H=170,pad=28;const mx=Math.max(1,...t.map(x=>x.save));const x=i=>pad+i*(W-pad*2)/11;const y=v=>H-pad-(v/mx)*(H-pad*2);const bw=(W-pad*2)/11-6;const pts=t.map((m,i)=>`${x(i)},${y(m.save)}`).join(' ');return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:180px">${t.map((m,i)=>`<rect x="${x(i)-bw/2}" y="${y(m.save)}" width="${bw}" height="${H-pad-y(m.save)}" fill="#27ae60" opacity="0.55" rx="2"/>`).join('')}<polyline points="${pts}" fill="none" stroke="#27ae60" stroke-width="2"/>${t.map((m,i)=>i%2?'':`<text x="${x(i)}" y="${H-pad+14}" font-size="10" fill="#999" text-anchor="middle">${m.month}月</text>`).join('')}</svg><p style="text-align:center;font-size:12px;color:#888;margin:4px 0 0">累计节约 ${yuan(t.length?t[t.length-1].save:0)}</p>`}

function renderTree(nodes){if(!nodes||!nodes.length)return '<div style="color:#bbb;font-size:12px;padding:20px;text-align:center">暂无巴单元，请新增</div>';const cls=lv=>lv===1?'lv1':'lv2';const walk=arr=>`<ul class="tree">${arr.map(o=>`<li class="${cls(o.amiba_level)}">${o.amiba_level===1?'🏢':'🔹'}<b>${esc(o.amiba_name)}</b><span class="tag">${esc(o.amiba_type)}</span>${o.charge_user_name?`<span style="font-size:11px;color:#667eea">👤 巴长:${esc(o.charge_user_name)}</span>`:''}${o.department?`<span style="font-size:11px;color:#888">🏢 ${esc(o.department)}</span>`:''}${o.sales_person?`<span style="font-size:11px;color:#27ae60">销售:${esc(o.sales_person)}</span>`:''} ${badge(o.status)} <button class="btn bs b4" onclick="orgForm(${o.id})" data-perm="amiba:edit">编辑</button> <button class="btn bs b1" onclick="bindForm(${o.id})" data-perm="amiba:edit">绑定巴长</button> <button class="btn bs b3" onclick="delOrg(${o.id})" data-perm="amiba:delete">删除</button>${o.children&&o.children.length?walk(o.children):''}</li>`).join('')}</ul>`;return walk(nodes)}

// 树状汇总渲染：一级巴为节点行，点击▼展开显示下级明细
function renderStatementTree(roots){
  if(!roots||!roots.length)return '<div style="color:#bbb;font-size:13px;padding:24px;text-align:center">暂无巴单元</div>';
  const levelClass=lv=>lv===1?'stmt-lv1':'stmt-lv2';
  function row(node){
    const a=node.aggregate||{};
    const hasChild=node.has_children;
    const expanded=_stmtTreeExpanded[node.id];
    const arrow=hasChild?(expanded?'▼':'▶'):'·';
    const selfMark=node.self?`<span class="badge green" style="margin-left:6px">已核算</span>`:(!hasChild?`<span class="badge gray" style="margin-left:6px">未生成</span>`:'');
    return `<div class="stmt-row ${levelClass(node.amiba_level)}" data-id="${node.id}" data-haschild="${hasChild?'1':'0'}">
      <div class="stmt-head" style="cursor:${hasChild?'pointer':'default'}" onclick="${hasChild?`toggleStmtNode(${node.id})`:''}">
        <span class="stmt-arrow" style="display:inline-block;width:16px;color:#667eea;font-size:11px">${arrow}</span>
        <span class="stmt-icon">${node.amiba_level===1?'🏢':'🔹'}</span>
        <b class="stmt-name">${esc(node.amiba_name)}</b>
        <span class="tag" style="font-size:10px;padding:1px 6px;border-radius:8px;background:#eef1ff;color:#667eea">${esc(node.amiba_type)}</span>
        ${selfMark}
        ${node.charge_user_name?`<span style="font-size:11px;color:#888">👤 ${esc(node.charge_user_name)}</span>`:''}
        ${node.department?`<span style="font-size:11px;color:#888">🏢 ${esc(node.department)}</span>`:''}
        ${hasChild?`<span style="font-size:11px;color:#9b59b6">📊 下级 ${node.child_count} 个巴</span>`:''}
      </div>
      <div class="stmt-metrics">
        <span class="stmt-m"><span class="lbl">收入</span><b style="color:#27ae60">${yuan(a.total_revenue)}</b></span>
        <span class="stmt-m"><span class="lbl">费用</span><b style="color:#e74c3c">${yuan(a.total_expense)}</b></span>
        <span class="stmt-m"><span class="lbl">附加值</span><b style="color:${a.value_added>=0?'#27ae60':'#e74c3c'}">${yuan(a.value_added)}</b></span>
        <span class="stmt-m"><span class="lbl">工时</span><b>${(a.total_hours||0).toLocaleString()}h</b></span>
        <span class="stmt-m"><span class="lbl">单位附加值</span><b>${yuan2(a.value_per_hour)}/h</b></span>
        <span class="stmt-m"><span class="lbl">净利润率</span><b style="color:${a.profit_margin>=15?'#27ae60':a.profit_margin>=0?'#f39c12':'#e74c3c'}">${percent(a.profit_margin)}</b></span>
        <span class="stmt-m"><span class="lbl">奖金池</span><b style="color:#e67e22">¥${yuan2(a.bonus_pool)}</b></span>
        ${hasChild?`<button class="btn bs b4" onclick="event.stopPropagation();_stmtAmibaId=${node.id};loadStmtView()" data-perm="amiba:view">查看核算表</button>`:''}
      </div>
    </div>
    ${hasChild?`<div class="stmt-children" style="display:${expanded?'block':'none'}">${node.children.map(row).join('')}</div>`:''}`;
  }
  return roots.map(row).join('');
}

function toggleStmtNode(id){
  _stmtTreeExpanded[id]=!_stmtTreeExpanded[id];
  // 找到对应节点行，切换其下方 .stmt-children 的显示 + 箭头
  const rows=document.querySelectorAll('.stmt-row');
  for(const r of rows){
    if(r.getAttribute('data-id')===String(id)){
      const next=r.nextElementSibling;
      if(next&&next.classList.contains('stmt-children')){
        next.style.display=_stmtTreeExpanded[id]?'block':'none';
      }
      const arrow=r.querySelector('.stmt-arrow');
      if(arrow)arrow.textContent=_stmtTreeExpanded[id]?'▼':'▶';
      break;
    }
  }
}

function collectStmtEdits(){
  // 从输入框收集手工编辑的费用/工时
  const lines=(caches.stmtDetail&&caches.stmtDetail.lines)||[];
  const inputs=document.querySelectorAll('#statementDetail input[data-line]');
  inputs.forEach(inp=>{
    const lineNo=Number(inp.dataset.line);const field=inp.dataset.field;const section=inp.dataset.section;
    const l=lines.find(x=>Number(x.line_no)===lineNo&&(section?x.section===section:true));
    if(l){ if(field==='total_hours'){l.amount=Number(inp.value)||0;} else {l.amount=Number(inp.value)||0;} }
  });
  return lines;
}

async function loadReport(){const list=await getJson(`${API}/report?year=${year()}&limit=999`);caches.report=list.data||[];const cols=[['年月',r=>r.year+'-'+String(r.month).padStart(2,'0')],['内容',r=>`<span title="${esc(r.report_content)}">${esc((r.report_content||'').substring(0,40).replace(/\n/g,' '))}…</span>`],['状态',r=>badge(r.publish_status)],['生成时间',r=>esc((r.created_at||'').substring(0,16))],['操作',r=>`<button class="btn bs b4" onclick="reportForm(${r.id})" data-perm="amiba:edit">编辑</button> <button class="btn bs b5" onclick="genReport()" data-perm="amiba:calc">生成最新月报</button>`]];document.getElementById('reportBox').innerHTML=`<div class="sb"><button class="btn b5" onclick="genReport()" data-perm="amiba:calc">一键生成本月月报</button><button class="btn b2" onclick="reportForm()" data-perm="amiba:edit">新建月报</button><button class="btn b4" onclick="exportExcel('${API}/report/export?year=${year()}')" data-perm="amiba:export">导出Excel</button><span style="margin-left:auto">共 <b>${list.total||0}</b> 份</span></div>${renderTable(cols,list.data||[],cols.length)}`;applyPerms()}
async function genReport(){const m=month()===''?new Date().getMonth()+1:month();const j=await postJson(`${API}/report/generate`,{year:year(),month:m});if(!confirm('已生成月报内容，是否保存？'))return;await postJson(`${API}/report`,{year:year(),month:m,report_content:j.report_content,publish_status:'草稿'});loadReport()}
async function reportForm(id){let row={year:year(),month:month()===''?new Date().getMonth()+1:month(),publish_status:'草稿'};if(id)row=(caches.report||[]).find(x=>x.id===id)||row;const f=[['year','年度','number'],['month','月份','number'],['publish_status','状态','select',[{id:'草稿',name:'草稿'},{id:'已发布',name:'已发布'},{id:'已归档',name:'已归档'}]],['file_url','附件链接','text'],['report_content','月报内容','textarea']];document.getElementById('formBox').innerHTML=`<div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3>${id?'编辑':'新建'}月报</h3><span onclick="closeForm()" style="cursor:pointer;font-size:24px;color:#999">&times;</span></div>${formFields(f,row)}<div style="text-align:right;margin-top:10px"><button class="btn b2" onclick="saveReport(${id||0})">保存</button></div>`;openForm()}
async function saveReport(id){const data=readForm([['year',''],['month',''],['publish_status',''],['file_url',''],['report_content','']]);if(id)data.id=id;await postJson(`${API}/report`,data);closeForm();loadReport()}

// ===== 外部API对接（供金蝶/WMS/MES 调用 · X-API-Key 鉴权）=====
const EXT_API_KEY = 'HJ-EBMS-KEY-2026-SECRET';
const EXT_BASE = '/api/external';

async function extFetch(path, opt) {
  const headers = Object.assign({}, (opt && opt.headers) || {}, { 'X-API-Key': EXT_API_KEY });
  if (opt && opt.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
  const r = await fetch(EXT_BASE + path, Object.assign({}, opt || {}, { headers }));
  const j = await r.json().catch(() => ({}));
  return { ok: r.ok, status: r.status, data: j };
}

async function loadExt() {
  const [statusRes, modulesRes, registryRes, lockedRes] = await Promise.all([
    extFetch('/status'),
    extFetch('/modules'),
    extFetch('/registry?limit=20'),
    extFetch('/locked')
  ]);
  const st = statusRes.data || {};
  const mods = (modulesRes.data && modulesRes.data.data) || [];
  const reg = (registryRes.data && registryRes.data.data) || [];
  const regSummary = (registryRes.data && registryRes.data.summary) || {};
  const locked = (lockedRes.data && lockedRes.data.data) || [];

  document.getElementById('extBox').innerHTML = `
  <div class="card" style="background:linear-gradient(135deg,#667eea,#764ba2);color:#fff">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-size:13px;opacity:.9">外部 API 对接服务</div>
        <div style="font-size:20px;font-weight:700;margin:4px 0">${esc(st.service || 'EBMS External API')} · v${esc(st.version || '1.0')}</div>
        <div style="font-size:12px;opacity:.9">状态：${st.code === 0 ? '🟢 正常连通' : '🔴 ' + esc(st.message || '')} · 阿米巴模块：${st.amiba_module ? '✅ 已暴露' : '❌'} · 服务器时间：${esc(st.server_time || '')}</div>
      </div>
      <div style="background:rgba(255,255,255,.15);padding:10px 14px;border-radius:8px;font-size:12px">
        <div>X-API-Key（外部系统调用凭证）</div>
        <code style="font-size:13px;color:#fff">${esc(EXT_API_KEY)}</code>
      </div>
    </div>
  </div>
  <div class="grid" style="margin-top:14px">
    <div class="cardx"><div class="n">${mods.length}</div><div class="l">暴露业务模块</div></div>
    <div class="cardx"><div class="n" style="color:#667eea">${mods.reduce((s2, m) => s2 + (m.table_count || 0), 0)}</div><div class="l">暴露表总数</div></div>
    <div class="cardx"><div class="n" style="color:#27ae60">${regSummary.out || 0}</div><div class="l">OUT 推送记录</div></div>
    <div class="cardx"><div class="n" style="color:#e67e22">${regSummary.back || 0}</div><div class="l">BACK 回传记录</div></div>
    <div class="cardx"><div class="n" style="color:#e74c3c">${regSummary.locked || 0}</div><div class="l">已锁定（不再覆盖）</div></div>
  </div>
  <div class="panel" style="margin-top:14px">
    <h3>暴露的表清单（含阿米巴全部业务表）</h3>
    <div class="tbl" style="max-height:none">
      <table>
        <thead><tr><th>模块</th><th>表名</th><th>显示名</th><th>说明</th><th>取数据 URL</th></tr></thead>
        <tbody>${mods.map(m => (m.tables || []).map(t => `<tr><td>${esc(m.module)}</td><td><code>${esc(t.table)}</code></td><td>${esc(t.name)}</td><td style="font-size:12px;color:#888">${esc(t.desc || '')}</td><td><code style="font-size:11px">/api/external/data/${esc(t.table)}?limit=10</code></td></tr>`).join('')).join('')}</tbody>
      </table>
    </div>
  </div>
  <div class="panel" style="margin-top:14px">
    <h3>同步登记清单（最新 20 条）</h3>
    ${renderTable([
      ['方向', r => r.direction === 'OUT' ? '<span class="badge blue">OUT</span>' : '<span class="badge green">BACK</span>'],
      ['表', r => `<code style="font-size:12px">${esc(r.source_table)}</code>`],
      ['业务键', r => esc(r.source_key || '')],
      ['状态', r => badge(r.status)],
      ['锁定', r => r.locked ? '🔒' : ''],
      ['摘要', r => esc((r.response_summary || '').substring(0, 60))],
      ['时间', r => esc((r.created_at || '').substring(0, 19))]
    ], reg, 7)}
  </div>
  <div class="panel" style="margin-top:14px">
    <h3>已锁定记录（外部已回传 · 不再推送覆盖）</h3>
    ${locked.length ? renderTable([
      ['表', r => `<code style="font-size:12px">${esc(r.source_table)}</code>`],
      ['业务键', r => esc(r.source_key || '')],
      ['锁定时间', r => esc((r.created_at || '').substring(0, 19))],
      ['备注', r => esc(r.remark || '')]
    ], locked, 4) : '<div style="color:#bbb;font-size:13px;padding:20px;text-align:center">暂无锁定记录</div>'}
  </div>
  <div class="panel" style="margin-top:14px">
    <h3>外部调用示例（curl）</h3>
    <pre style="background:#2c3e50;color:#ecf0f1;padding:14px;border-radius:6px;overflow:auto;font-size:12px;line-height:1.7">
# 1. 连通性自检
curl -H "X-API-Key: ${EXT_API_KEY}" ${window.location.origin}${EXT_BASE}/status

# 2. 业务模块清单
curl -H "X-API-Key: ${EXT_API_KEY}" ${window.location.origin}${EXT_BASE}/modules

# 3. 推送应收(AR) → 写入 amiba_ar，自动确认收入
curl -X POST -H "X-API-Key: ${EXT_API_KEY}" -H "Content-Type: application/json" \\
  ${window.location.origin}${EXT_BASE}/receive -d '{
  "source_table": "amiba_ar",
  "source_key":   "AR2026-001",
  "data":         {"amiba_id":3,"customer_name":"客户X","amount":50000,"trade_date":"2026-07-15","status":"open"},
  "remark":       "金蝶推送"
}'

# 4. 推送应付(AP) → 写入 amiba_ap，自动确认成本
curl -X POST -H "X-API-Key: ${EXT_API_KEY}" -H "Content-Type: application/json" \\
  ${window.location.origin}${EXT_BASE}/receive -d '{
  "source_table": "amiba_ap",
  "source_key":   "AP2026-001",
  "data":         {"amiba_id":1,"supplier_name":"供应商Y","amount":30000,"trade_date":"2026-07-12","status":"open"},
  "remark":       "金蝶推送"
}'

# 5. 拉取阿米巴交易明细（OUT，自动登记）
curl -H "X-API-Key: ${EXT_API_KEY}" "${window.location.origin}${EXT_BASE}/data/amiba_trade_detail?limit=10"

# 6. 查看同步清单
curl -H "X-API-Key: ${EXT_API_KEY}" "${window.location.origin}${EXT_BASE}/registry?limit=20"
    </pre>
  </div>`;
  applyPerms();
}

loadDashboard();
