<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>项目技转管理</title><link rel="stylesheet" href="common.css">
<style>
.sb{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.sb input,.sb select{padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
th{background:#f5f6fa;padding:9px 8px;text-align:left;font-weight:600;color:#555;border-bottom:2px solid #eee;white-space:nowrap;position:sticky;top:0}
td{padding:7px 8px;border-bottom:1px solid #f0f0f0;vertical-align:top}
tr:hover td{background:#f8f9ff}
.btn{padding:7px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.b1{background:#667eea;color:#fff}.b2{background:#27ae60;color:#fff}.b3{background:#e74c3c;color:#fff}.b4{background:#f39c12;color:#fff}.b5{background:#3498db;color:#fff}.bd{background:#fff;border:1px solid #ddd;color:#555}
.btn:hover{opacity:.85}
.bs{padding:3px 8px;font-size:11px}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.sc{background:#fff;padding:12px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.06);text-align:center}
.sc .n{font-size:22px;font-weight:700;color:#667eea}.sc .l{font-size:11px;color:#999;margin-top:2px}
.em{text-align:center;color:#999;padding:30px}
.mo{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:flex-start;padding-top:20px}.mo.ac{display:flex}
.mb2{background:#fff;border-radius:12px;padding:20px;width:560px;max-width:95%;max-height:90vh;overflow:auto}
.fg{margin-bottom:8px}.fg label{display:block;font-size:12px;color:#666;margin-bottom:3px}
.fg input,.fg select,.fg textarea{width:100%;padding:6px 8px;border:1px solid #ddd;border-radius:4px;font-size:13px}
.fg textarea{resize:vertical;min-height:54px}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.tbl-wrap{overflow-x:auto;max-height:62vh;overflow-y:auto}
.lv1{background:#d1ecf1;color:#0c5460}.lv2{background:#ffe8cc;color:#b35400}.lv3{background:#fadbd8;color:#a93226}
.st0{background:#eee;color:#666}.st1{background:#fff3cd;color:#856404}.st2{background:#d4edda;color:#155724}.st3{background:#d5d8dc;color:#566573}.st4{background:#cce5ff;color:#004085}
.st-audit0{background:#eee;color:#666}.st-audit1{background:#fff3cd;color:#856404}.st-audit2{background:#d1ecf1;color:#0c5460}.st-audit3{background:#fadbd8;color:#a93226}.st-audit4{background:#cce5ff;color:#004085}.st-audit5{background:#d4edda;color:#155724}
.tip{font-size:12px;color:#999;margin-top:4px}
.warn-box{background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:13px;color:#8a6d3b}
.flow-mini{display:inline-flex;gap:4px;align-items:center;font-size:11px}
.flow-mini .fs{padding:2px 7px;border-radius:4px;background:#eee;color:#888}
.flow-mini .fs.done{background:#d4edda;color:#155724}
.flow-mini .fs.cur{background:#667eea;color:#fff}
.flow-mini .fa{color:#ccc}
.detail-section{margin-bottom:18px}
.detail-section h4{font-size:13px;color:#333;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #eee}
.doc-link{color:#667eea;cursor:pointer;text-decoration:underline}
</style></head><body>
<div class="sidebar" id="sidebar"></div>
<div class="main-content">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
<h2>项目技转管理</h2>
<span style="font-size:12px;color:#999">全技术资料受控流转闭环</span>
</div>

<div class="tab-nav" id="mainTabs">
  <button class="active" onclick="switchTab('docs',this)">技术资料库</button>
  <button onclick="switchTab('flow',this)">技转流转</button>
  <button onclick="switchTab('change',this)">技术变更</button>
  <button onclick="switchTab('review',this)">复盘与案例</button>
  <button data-perm="tech:admin" onclick="switchTab('audit',this)">审计合规</button>
</div>

<!-- ===== Tab1 技术资料库 ===== -->
<div class="tab-pane" id="pane-docs">
  <div class="sg" id="docStats"></div>
  <div class="sb">
    <input type="text" id="dKw" placeholder="搜索编号/标题/项目/客户" style="width:230px" onkeydown="if(event.key==='Enter')loadDocs(1)">
    <select id="dCat">
      <option value="">全部分类</option>
      <option value="presale">售前技术对接</option><option value="sample">样品技术验证</option>
      <option value="initiate">项目立项技转</option><option value="production">核心生产工艺</option>
      <option value="delivery">履约交付</option><option value="review">技术复盘迭代</option>
    </select>
    <select id="dLevel">
      <option value="">全部分级</option><option value="1">通用</option><option value="2">核心</option><option value="3">涉密</option>
    </select>
    <select id="dStatus">
      <option value="">全部状态</option><option>新增</option><option>待审核</option><option>已归档</option><option>已作废</option><option>已迭代</option>
    </select>
    <input type="text" id="dProj" placeholder="项目编号" style="width:130px">
    <button class="btn b1" onclick="loadDocs(1)">搜索</button>
    <button class="btn b2" data-perm="tech:create" onclick="openUpload()" style="margin-left:auto">上传资料</button>
    <span>共 <b id="dTc">0</b> 条</span>
  </div>
  <div class="tbl-wrap">
    <table><thead><tr>
    <th>资料编号</th><th>标题</th><th>分类</th><th>分级</th><th>状态</th><th>项目/客户</th><th>版本</th><th>上传人</th><th>操作</th>
    </tr></thead><tbody id="dTb"><tr><td colspan="9" class="em">暂无数据</td></tr></tbody></table>
  </div>
  <div id="dPg" style="margin-top:12px;text-align:center"></div>
</div>

<!-- ===== Tab2 技转流转 ===== -->
<div class="tab-pane" id="pane-flow" style="display:none">
  <div class="sb">
    <input type="text" id="fKw" placeholder="搜索项目编号/客户" style="width:230px" onkeydown="if(event.key==='Enter')loadFlows(1)">
    <select id="fStage">
      <option value="">全部阶段</option><option value="presale">售前对接</option><option value="rd">研发定型</option><option value="production">生产落地</option><option value="delivery">交付复盘</option>
    </select>
    <button class="btn b1" onclick="loadFlows(1)">搜索</button>
    <span>共 <b id="fTc">0</b> 条</span>
  </div>
  <div class="tbl-wrap">
    <table><thead><tr>
    <th>项目编号</th><th>项目名称</th><th>客户</th><th>技转进度</th><th>当前阶段</th><th>交底</th><th>变更</th><th>研发负责人</th><th>操作</th>
    </tr></thead><tbody id="fTb"><tr><td colspan="9" class="em">暂无数据</td></tr></tbody></table>
  </div>
  <div id="fPg" style="margin-top:12px;text-align:center"></div>
</div>

<!-- ===== Tab3 技术变更 ===== -->
<div class="tab-pane" id="pane-change" style="display:none">
  <div class="sb">
    <input type="text" id="cKw" placeholder="搜索变更编号/范围/原因" style="width:230px" onkeydown="if(event.key==='Enter')loadChanges(1)">
    <select id="cType"><option value="">全部类型</option><option>参数</option><option>工艺</option><option>合规</option></select>
    <select id="cStatus"><option value="">全部状态</option><option>发起</option><option>审核中</option><option>已通过</option><option>已驳回</option><option>已执行</option><option>已校验</option></select>
    <button class="btn b1" onclick="loadChanges(1)">搜索</button>
    <button class="btn b2" data-perm="tech:change" onclick="openChange()" style="margin-left:auto">发起变更</button>
    <span>共 <b id="cTc">0</b> 条</span>
  </div>
  <div class="tbl-wrap">
    <table><thead><tr>
    <th>变更编号</th><th>研发项目</th><th>类型</th><th>范围</th><th>变更前→后</th><th>原因</th><th>状态</th><th>发起人</th><th>操作</th>
    </tr></thead><tbody id="cTb"><tr><td colspan="9" class="em">暂无数据</td></tr></tbody></table>
  </div>
  <div id="cPg" style="margin-top:12px;text-align:center"></div>
</div>

<!-- ===== Tab4 复盘与案例 ===== -->
<div class="tab-pane" id="pane-review" style="display:none">
  <div class="tab-nav" style="margin-bottom:14px">
    <button class="active" onclick="switchSub('rvw',this)">技术复盘</button>
    <button onclick="switchSub('case',this)">技术案例库</button>
  </div>
  <div id="sub-rvw">
    <div class="sb">
      <select id="rDim"><option value="">全部维度</option><option value="parameter">参数复盘</option><option value="process">工艺复盘</option><option value="flow">流程复盘</option><option value="risk">风险复盘</option></select>
      <select id="rStatus"><option value="">全部状态</option><option>草稿</option><option>已完成</option></select>
      <button class="btn b1" onclick="loadReviews(1)">搜索</button>
      <button class="btn b2" data-perm="tech:review" onclick="openReview()" style="margin-left:auto">新建复盘</button>
      <span>共 <b id="rTc">0</b> 条</span>
    </div>
    <div class="tbl-wrap">
      <table><thead><tr><th>编号</th><th>项目</th><th>维度</th><th>发现/问题</th><th>改进方案</th><th>状态</th><th>操作</th></tr></thead>
      <tbody id="rTb"><tr><td colspan="7" class="em">暂无数据</td></tr></tbody></table>
    </div>
    <div id="rPg" style="margin-top:12px;text-align:center"></div>
  </div>
  <div id="sub-case" style="display:none">
    <div class="sb">
      <input type="text" id="caKw" placeholder="搜索案例标题/问题/方案" style="width:240px" onkeydown="if(event.key==='Enter')loadCases(1)">
      <select id="caType"><option value="">全部问题类型</option><option value="parameter">参数</option><option value="process">工艺</option><option value="flow">流程</option><option value="risk">风险</option></select>
      <button class="btn b1" onclick="loadCases(1)">搜索</button>
      <button class="btn b2" data-perm="tech:case:manage" onclick="openCase()" style="margin-left:auto">录入案例</button>
      <span>共 <b id="caTc">0</b> 条</span>
    </div>
    <div class="tbl-wrap">
      <table><thead><tr><th>案例编号</th><th>标题</th><th>问题类型</th><th>问题描述</th><th>解决方案</th><th>来源项目</th><th>阅读</th><th>操作</th></tr></thead>
      <tbody id="caTb"><tr><td colspan="8" class="em">暂无数据</td></tr></tbody></table>
    </div>
    <div id="caPg" style="margin-top:12px;text-align:center"></div>
  </div>
</div>

<!-- ===== Tab5 审计合规 ===== -->
<div class="tab-pane" id="pane-audit" style="display:none">
  <div class="sg" id="alertBox"></div>
  <div class="sb">
    <select id="aAction"><option value="">全部动作</option><option>upload</option><option>edit</option><option>preview</option><option>download</option><option>forward</option><option>delete</option><option>reuse</option><option>audit</option></select>
    <select id="aResult"><option value="">全部结果</option><option>success</option><option>denied</option></select>
    <input type="text" id="aUser" placeholder="用户ID" style="width:90px">
    <button class="btn b1" onclick="loadLogs(1)">筛选</button>
    <button class="btn bd" onclick="loadLevelCfg()" data-perm="tech:admin">分级配置</button>
    <span>共 <b id="aTc">0</b> 条</span>
  </div>
  <div class="tbl-wrap">
    <table><thead><tr><th>时间</th><th>用户</th><th>动作</th><th>结果</th><th>资料</th><th>原因/IP</th></tr></thead>
    <tbody id="aTb"><tr><td colspan="6" class="em">暂无数据</td></tr></tbody></table>
  </div>
  <div id="aPg" style="margin-top:12px;text-align:center"></div>
</div>

</div>

<div class="mo" id="gMo"><div class="mb2" id="gMoBox"></div></div>

<script>
const API='/api/tech';
const catMap={presale:'售前对接',sample:'样品验证',initiate:'项目立项',production:'生产工艺',delivery:'履约交付',review:'复盘迭代'};
const stageMap={presale:'售前对接',rd:'研发定型',production:'生产落地',delivery:'交付复盘'};
const dimMap={parameter:'参数复盘',process:'工艺复盘',flow:'流程复盘',risk:'风险复盘'};
const levelMap={1:'通用',2:'核心',3:'涉密'};
const docStatusMap={'新增':'st0','待审核':'st1','已归档':'st2','已作废':'st3','已迭代':'st4'};
const changeStatusMap={'发起':'st-audit0','审核中':'st-audit1','已通过':'st-audit2','已驳回':'st-audit3','已执行':'st-audit4','已校验':'st-audit5'};

function switchTab(id,btn){
  const tabs=document.querySelectorAll('#mainTabs button');
  const idxMap={docs:0,flow:1,change:2,review:3,audit:4};
  const idx=idxMap[id];
  if(tabs[idx])tabs.forEach((b,i)=>b.classList.toggle('active',i===idx));
  ['docs','flow','change','review','audit'].forEach(t=>{const el=document.getElementById('pane-'+t);if(el)el.style.display=(t===id?'block':'none')});
  if(id==='docs')loadDocs(1);
  if(id==='flow')loadFlows(1);
  if(id==='change')loadChanges(1);
  if(id==='review'){loadReviews(1);loadCases(1);}
  if(id==='audit'){loadAlerts();loadLogs(1);}
}
function switchSub(id,btn){
  const subTabs=document.querySelectorAll('#pane-review .tab-nav button');
  const idxMap={rvw:0,case:1};
  const idx=idxMap[id];
  if(subTabs[idx])subTabs.forEach((b,i)=>b.classList.toggle('active',i===idx));
  const r=document.getElementById('sub-rvw'),c=document.getElementById('sub-case');
  if(r)r.style.display=(id==='rvw'?'block':'none');
  if(c)c.style.display=(id==='case'?'block':'none');
}

function renderPg(elId,total,page,fn){
  var ps = (window._pageSize || 50),pages=Math.ceil(total/ps),el=document.getElementById(elId);
  if(pages<=1){el.innerHTML='';return}
  let h='';
  if(page>1)h+=`<button class="btn bs" onclick="${fn.name}(${page-1})">上一页</button> `;
  for(let i=Math.max(1,page-2);i<=Math.min(pages,page+2);i++)h+=`<button class="btn bs ${i===page?'b1':''}" onclick="${fn.name}(${i})">${i}</button> `;
  if(page<pages)h+=`<button class="btn bs" onclick="${fn.name}(${page+1})">下一页</button>`;
  el.innerHTML=h;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function openMo(html){document.getElementById('gMoBox').innerHTML=html;document.getElementById('gMo').classList.add('ac')}
function closeMo(){document.getElementById('gMo').classList.remove('ac')}

// ============ Tab1 技术资料库 ============
async function loadDocStats(){
  try{
    const r=await fetch(API+'/documents/stats');const d=await r.json();
    document.getElementById('docStats').innerHTML=`
      <div class="sc"><div class="n">${d.total||0}</div><div class="l">资料总数</div></div>
      <div class="sc"><div class="n" style="color:#3498db">${(d.by_level||{})['1']||0}</div><div class="l">通用</div></div>
      <div class="sc"><div class="n" style="color:#f39c12">${(d.by_level||{})['2']||0}</div><div class="l">核心</div></div>
      <div class="sc"><div class="n" style="color:#e74c3c">${(d.by_level||{})['3']||0}</div><div class="l">涉密</div></div>
      <div class="sc"><div class="n" style="color:#27ae60">${d.archived||0}</div><div class="l">已归档</div></div>
      <div class="sc"><div class="n" style="color:#764ba2">${d.projects_covered||0}</div><div class="l">覆盖项目</div></div>`;
  }catch(e){console.error(e)}
}
async function loadDocs(page){
  page=page||1;
  const p=new URLSearchParams({page,limit:(window._pageSize||50)});
  const kw=VAL('dKw'),cat=VAL('dCat'),lv=VAL('dLevel'),st=VAL('dStatus'),pj=VAL('dProj');
  if(kw)p.set('keyword',kw);if(cat)p.set('category',cat);if(lv)p.set('level',lv);if(st)p.set('status',st);if(pj)p.set('project_no',pj);
  try{
    const r=await fetch(API+'/documents?'+p);const d=await r.json();
    const total=d.total||0;document.getElementById('dTc').textContent=total;
    const recs=d.data||[],tb=document.getElementById('dTb');
    if(!recs.length){tb.innerHTML='<tr><td colspan="9" class="em">暂无数据</td></tr>';renderPg('dPg',total,page,loadDocs);return}
    tb.innerHTML=recs.map(s=>{
      const stage=s.approval_stage||'dept_review';
      const stageLabel={dept_review:'待部门经理审核',gm_approve:'待总经理批准',approved:'已批准署名',rejected:'已驳回'}[stage]||stage;
      const stageCls={dept_review:'st1',gm_approve:'st4',approved:'st2',rejected:'st3'}[stage]||'st0';
      let approveBtn='';
      if(stage==='dept_review')approveBtn=`<button class="btn bs b2" data-perm="tech:approve:dept" onclick="approveDoc(${s.id},'dept')">部门审核</button>`;
      else if(stage==='gm_approve')approveBtn=`<button class="btn bs b2" data-perm="tech:approve:gm" onclick="approveDoc(${s.id},'gm')">总经理批准</button>`;
      return `<tr>
      <td><b>${esc(s.doc_no)}</b></td>
      <td><span class="doc-link" onclick="viewDoc(${s.id})">${esc(s.title)}</span></td>
      <td>${catMap[s.category]||s.category||'-'}</td>
      <td><span class="badge lv${s.level}">${levelMap[s.level]||s.level}</span></td>
      <td><span class="badge ${stageCls}">${stageLabel}</span>${stage==='approved'?'<div class="tip" style="margin-top:2px;color:#27ae60">☑ 已署名</div>':''}</td>
      <td>${esc(s.project_no||s.customer_name||'-')}</td>
      <td>${esc(s.version||'')}</td>
      <td>${esc(s.uploaded_by||'-')}</td>
      <td style="white-space:nowrap">
        ${approveBtn}
        <button class="btn bs b5" onclick="previewDoc(${s.id})">预览</button>
        <button class="btn bs b2" onclick="downloadDoc(${s.id})">下载</button>
        <button class="btn bs bd" onclick="docVersions(${s.id})">版本</button>
        <button class="btn bs b4" data-perm="tech:edit" onclick="newVersion(${s.id})">迭代</button>
      </td></tr>`}).join('');
    renderPg('dPg',total,page,loadDocs);
    if(window.PermissionCheck)PermissionCheck.applyToPage();
  }catch(e){console.error(e)}
}
function VAL(id){const el=document.getElementById(id);return el?el.value:''}

function openUpload(){
  const html=`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h3>上传技术资料</h3><span onclick="closeMo()" style="cursor:pointer;font-size:22px;color:#999">×</span></div>
  <form id="upForm" enctype="multipart/form-data">
    <div id="dropZone" style="margin-bottom:10px;padding:28px 16px;border:2px dashed #b8c2d6;border-radius:10px;text-align:center;cursor:pointer;background:#fafbff;transition:all .25s">
      <div style="font-size:30px;color:#667eea;line-height:1">⬆</div>
      <div style="font-size:13px;color:#344054;margin-top:8px">将文件拖拽到此处，或 <span style="color:#667eea;font-weight:600;text-decoration:underline">点击选择文件</span></div>
      <div class="tip" id="fileHint" style="margin-top:4px">支持 PDF / 图纸 / 图片 / 文档等，单文件最大 100MB</div>
      <input type="file" name="file" id="fileInput" required style="display:none" onchange="onFilePick(this)">
    </div>
    <div class="gr"><div class="fg"><label>标题</label><input name="title" placeholder="留空取文件名"></div>
    <div class="fg"><label>资料编号</label><input name="doc_no" placeholder="留空自动生成"></div></div>
    <div class="gr">
      <div class="fg"><label>六大分类 *</label><select name="category">
        ${Object.entries(catMap).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}
      </select></div>
      <div class="fg"><label>分级 *</label><select name="level" id="upLevel" onchange="toggleLevelWarn()">
        <option value="1">通用（全员可查）</option><option value="2">核心（研发/项目/管理层）</option><option value="3">涉密（仅超管）</option>
      </select></div>
    </div>
    <div id="lvlWarn"></div>
    <div class="gr">
      <div class="fg"><label>关联项目ID</label><input name="project_id" placeholder="可选"></div>
      <div class="fg"><label>项目编号</label><input name="project_no"></div>
    </div>
    <div class="gr">

function flowBar(f){
  const stages=[['presale',f.presale_status],['rd',f.rd_status],['production',f.production_status],['delivery',f.delivery_status]];
  return '<span class="flow-mini">'+stages.map((s,i)=>{
    const cls=s[1]==='完成'?'done':(f.current_stage===s[0]?'cur':'');
    const arr=i<stages.length-1?'<span class="fa">→</span>':'';
    return `<span class="fs ${cls}">${stageMap[s[0]]}</span>${arr}`;
  }).join('')+'</span>';
}
async function loadFlows(page){
  page=page||1;
  const p=new URLSearchParams({page,limit:(window._pageSize||50)});
  const kw=VAL('fKw'),st=VAL('fStage');
  if(kw)p.set('keyword',kw);if(st)p.set('current_stage',st);
  try{
    const r=await fetch(API+'/flows?'+p);const d=await r.json();
    const total=d.total||0;document.getElementById('fTc').textContent=total;
    const recs=d.data||[],tb=document.getElementById('fTb');
    if(!recs.length){tb.innerHTML='<tr><td colspan="9" class="em">暂无数据</td></tr>';renderPg('fPg',total,page,loadFlows);return}
    tb.innerHTML=recs.map(f=>{
      const started=f.tech_started;
      const stageBadge=started?`<span class="badge st4">${stageMap[f.current_stage]||f.current_stage}</span>`:'<span class="badge st0">未启动</span>';
      const btn=started
        ?`<button class="btn bs b5" onclick="viewFlow(${f.project_id})">详情</button>`
        :`<button class="btn bs b2" data-perm="tech:transfer" onclick="startTech(${f.project_id})">启动技转</button>`;
      return `<tr>
      <td><b>${esc(f.project_no||'-')}</b></td>
      <td><span class="doc-link" onclick="viewFlow(${f.project_id})">${esc(f.project_name||'-')}</span></td>
      <td>${esc(f.customer_name||'-')}</td>
      <td>${started?flowBar(f):'<span style="color:#bbb;font-size:11px">— 未启动 —</span>'}</td>
      <td>${stageBadge}</td>
      <td>${f.handover_count||0}</td>
      <td>${f.change_count||0}</td>
      <td>${esc(f.owner||f.tech_lead||'-')}</td>

    renderPg('fPg',total,page,loadFlows);
  }catch(e){console.error(e)}

function changeActions(c){
  let b='';
  const P='data-perm="tech:change"';
  if(c.status==='发起')b+=`<button class="btn bs b4" ${P} onclick="changeStep(${c.id},'audit','审核中')">审核</button> `;
  if(c.status==='审核中')b+=`<button class="btn bs b2" ${P} onclick="changeStep(${c.id},'audit','已通过')">通过</button> <button class="btn bs b3" ${P} onclick="changeStep(${c.id},'audit','已驳回')">驳回</button> `;
  if(c.status==='已通过')b+=`<button class="btn bs b2" ${P} onclick="changeStep(${c.id},'execute','已执行')">执行</button> `;
  if(c.status==='已执行')b+=`<button class="btn bs b5" ${P} onclick="changeVerify(${c.id})">校验</button> `;
  return b||'<span style="color:#999">已闭环</span>';
}
