<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>企业经营管理平台（EBMS）-HJ - 配置表库</title><link rel="stylesheet" href="common.css">
<style>
.tv{display:flex;border-bottom:2px solid #eee;margin-bottom:16px}
.tv button{padding:10px 18px;border:none;background:none;cursor:pointer;font-size:14px;color:#666;border-bottom:2px solid transparent;margin-bottom:-2px}
.tv button.ac{color:#667eea;border-bottom-color:#667eea;font-weight:600}
.tc{display:none}.tc.ac{display:block}
.sb{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.sb input,.sb select{padding:7px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px}
.btn{padding:7px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.b1{background:#667eea;color:#fff}.b2{background:#27ae60;color:#fff}.b3{background:#e74c3c;color:#fff}.b4{background:#f39c12;color:#fff}.b5{background:#3498db;color:#fff}.bs{padding:3px 8px;font-size:11px}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
th{background:#f5f6fa;padding:9px 8px;text-align:left;font-weight:600;color:#555;border-bottom:2px solid #eee;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid #f0f0f0;vertical-align:top}
tr:hover td{background:#f8f9ff}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.bg-r{background:#f8d7da;color:#721c24}.bg-o{background:#fff3cd;color:#856404}.bg-g{background:#d4edda;color:#155724}.bg-b{background:#cce5ff;color:#004085}.bg-n{background:#e2e3e5;color:#383d41}
.em{text-align:center;color:#999;padding:30px}
.tbl-wrap{overflow-x:auto;max-height:65vh;overflow-y:auto}
.mo{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:flex-start;padding-top:20px}.mo.ac{display:flex}
.mb{background:#fff;border-radius:12px;padding:20px;width:650px;max-width:95%;max-height:90vh;overflow:auto}
.pg{text-align:center;margin-top:12px}
.fg{margin-bottom:8px}.fg label{display:block;font-size:12px;color:#666;margin-bottom:3px}
.fg input,.fg select,.fg textarea{width:100%;padding:6px 8px;border:1px solid #ddd;border-radius:4px;font-size:13px}
.fg textarea{resize:vertical;min-height:50px}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style></head><body data-page-title="配置表库" data-page-perm="config-lib:view">
<div class="sidebar" id="sidebar"></div>
<div class="main-content">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
<h2>配置表库</h2>
<div style="display:flex;gap:8px">
<button class="btn b2" onclick="batchExport('xlsx')">批量导出Excel</button>
<button class="btn b4" onclick="batchExport('pdf')">批量导出PDF</button>
</div>
</div>

<div class="tv" id="tabNav">
<button class="ac" onclick="swTab('config',this)">配置表</button>
</div>

<div class="tc ac" id="tab-config">
<div class="sb">
<input type="text" id="cfgKw" placeholder="搜索型号/关键字" style="width:200px" onkeydown="if(event.key==='Enter')loadConfigs(1)">
<select id="cfgStatus"><option value="">全部状态</option><option value="有效">有效</option><option value="废弃">废弃</option></select>
<select id="cfgType"><option value="">全部类型</option></select>
<button class="btn b1" onclick="loadConfigs(1)">搜索</button>
<span style="margin-left:auto">共 <b id="cfgTc">0</b> 条</span>
</div>
<div class="tbl-wrap">
<table><thead><tr>
<th>型号</th><th>版本</th><th>名称</th><th>配置类型</th><th>所属产品</th><th>状态</th><th>更新日期</th><th>操作</th>
</tr></thead><tbody id="cfgTb"><tr><td colspan="8" class="em">暂无配置表</td></tr></tbody></table>
</div>
<div class="pg" id="cfgPg"></div>
</div>
</div>

<div class="mo" id="dMo"><div class="mb">
<div style="display:flex;justify-content:space-between;margin-bottom:12px">
<h3 id="dMoTi">配置表详情</h3><span onclick="document.getElementById('dMo').classList.remove('ac')" style="cursor:pointer;font-size:22px;color:#999">&times;</span>
</div>
<div id="dMoBody"></div>
</div></div>

<div class="mo" id="eMo"><div class="mb">
<div style="display:flex;justify-content:space-between;margin-bottom:12px">
<h3 id="eMoTi">编辑配置表</h3><span onclick="document.getElementById('eMo').classList.remove('ac')" style="cursor:pointer;font-size:22px;color:#999">&times;</span>
</div>
<div id="eMoBody"></div>
</div></div>

<script>
const API='/api/spec-library';
let cfgPage=1;

function swTab(name,btn){
  document.querySelectorAll('#tabNav button').forEach(b=>b.classList.remove('ac'));
  document.querySelectorAll('.tc').forEach(t=>t.classList.remove('ac'));
  btn.classList.add('ac');
  document.getElementById('tab-'+name).classList.add('ac');
  if(name==='config')loadConfigs(1);
}

async function loadConfigTypes(){
  try{
    const r=await fetch(API+'/config-sheets?limit=999');const d=await r.json();
    const recs=d.data||d||[];
    const types=[...new Set(recs.map(c=>c.config_type).filter(Boolean))];
    document.getElementById('cfgType').innerHTML='<option value="">全部类型</option>'+types.map(t=>`<option value="${t}">${t}</option>`).join('');
  }catch(e){}
}

async function loadConfigs(page){
  cfgPage=page||1;
  const p=new URLSearchParams({page:cfgPage,limit:(window._pageSize||20)});
  const kw=document.getElementById('cfgKw').value,st=document.getElementById('cfgStatus').value,tp=document.getElementById('cfgType').value;
  if(kw)p.set('keyword',kw);if(st)p.set('status',st);if(tp)p.set('config_type',tp);
  try{
    const r=await fetch(API+'/config-sheets?'+p);const d=await r.json();
    const total=d.total||0;document.getElementById('cfgTc').textContent=total;
    const recs=d.data||d||[],tb=document.getElementById('cfgTb');
    if(!recs.length){tb.innerHTML='<tr><td colspan="8" class="em">暂无配置表</td></tr>';renderPg(total);return}
    tb.innerHTML=recs.map(c=>`<tr>
      <td><b>${c.model||c.part_number||'-'}</b></td>
      <td>${c.version||'-'}</td>
      <td>${(c.name||c.config_name||'').substring(0,25)}</td>
      <td>${c.config_type||'-'}</td>
      <td>${c.product_name||c.parent_product||'-'}</td>
      <td><span class="badge ${c.status==='有效'?'bg-g':c.status==='废弃'?'bg-n':'bg-o'}">${c.status||'-'}</span></td>
      <td>${c.updated_at||c.modified_at||'-'}</td>
      <td style="white-space:nowrap">
        <button class="btn bs b1" onclick="openDtl(${c.id})">详情</button>
        <button class="btn bs b4" onclick="openEdit(${c.id})">编辑</button>
        <button class="btn bs b3" onclick="delConfig(${c.id})" data-perm="config-lib:delete">删除</button>
      </td>
    </tr>`).join('');
    renderPg(total);
  }catch(e){console.error(e)}
}

function renderPg(total){
  var ps = (window._pageSize || 20),pages=Math.ceil(total/ps),el=document.getElementById('cfgPg');
  if(pages<=1){el.innerHTML='';return}
  let h='';
  if(cfgPage>1)h+=`<button class="btn bs" onclick="loadConfigs(${cfgPage-1})">上一页</button> `;
  for(let i=Math.max(1,cfgPage-2);i<=Math.min(pages,cfgPage+2);i++)h+=`<button class="btn bs ${i===cfgPage?'b1':''}" onclick="loadConfigs(${i})">${i}</button> `;
  if(cfgPage<pages)h+=`<button class="btn bs" onclick="loadConfigs(${cfgPage+1})">下一页</button>`;
  el.innerHTML=h;
}

async function openDtl(id){
  try{
    const r=await fetch(API+'/config-sheets?limit=999');const d=await r.json();
    const c=(d.data||d||[]).find(x=>x.id===id);
    if(!c){alert('未找到该配置表');return}
    document.getElementById('dMoTi').textContent='配置表详情 - '+(c.model||c.part_number||'');
    document.getElementById('dMoBody').innerHTML=`
      <table style="width:100%;font-size:13px">
        <tr><td style="color:#999;width:100px">型号</td><td><b>${c.model||c.part_number||'-'}</b></td></tr>
        <tr><td style="color:#999">版本</td><td>${c.version||'-'}</td></tr>
        <tr><td style="color:#999">名称</td><td>${c.name||c.config_name||'-'}</td></tr>
        <tr><td style="color:#999">配置类型</td><td>${c.config_type||'-'}</td></tr>
        <tr><td style="color:#999">所属产品</td><td>${c.product_name||c.parent_product||'-'}</td></tr>
        <tr><td style="color:#999">状态</td><td><span class="badge ${c.status==='有效'?'bg-g':c.status==='废弃'?'bg-n':'bg-o'}">${c.status||'-'}</span></td></tr>
        <tr><td style="color:#999">创建日期</td><td>${c.created_at||'-'}</td></tr>
        <tr><td style="color:#999">更新日期</td><td>${c.updated_at||c.modified_at||'-'}</td></tr>
        <tr><td style="color:#999">规格书关联</td><td>${c.spec_id||'-'}</td></tr>
        <tr><td style="color:#999">备注</td><td>${c.remarks||c.note||'-'}</td></tr>
      </table>
    `;
    document.getElementById('dMo').classList.add('ac');
  }catch(e){alert('加载失败: '+e.message)}
}

async function openEdit(id){
  try{
    const r=await fetch(API+'/config-sheets?limit=999');const d=await r.json();
    const c=(d.data||d||[]).find(x=>x.id===id);if(!c)return;
    document.getElementById('eMoTi').textContent='编辑配置表';
    document.getElementById('eMoBody').innerHTML=buildForm(c);
    document.getElementById('eMo').classList.add('ac');
    document.getElementById('cfgSave').onclick=async()=>{
      const data=collectForm();
      await fetch(API+'/config-sheets/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
      document.getElementById('eMo').classList.remove('ac');loadConfigs(cfgPage);
    };
  }catch(e){alert('加载失败')}
}

function buildForm(data){
  const fields=['model','version','name','config_type','product_name','status','remarks'];
  let h='<div style="max-height:55vh;overflow-y:auto">';
  for(let i=0;i<fields.length;i++){
    const f=fields[i],val=data[f]||'';
    if(f==='remarks'){
      h+=`<div class="fg"><label>${f}</label><textarea id="fe_${f}">${val}</textarea></div>`;
    }else{
      const next=fields[i+1];
      if(next&&next!=='remarks'){
        const nval=data[next]||'';
        h+=`<div class="gr"><div class="fg"><label>${f}</label><input id="fe_${f}" value="${val}"></div><div class="fg"><label>${next}</label><input id="fe_${next}" value="${nval}"></div></div>`;
        i++;
      }else{
        h+=`<div class="fg"><label>${f}</label><input id="fe_${f}" value="${val}"></div>`;
      }
    }
  }
  h+='</div><div style="text-align:right;margin-top:12px"><button class="btn b2" id="cfgSave">保存</button></div>';
  return h;
}

function collectForm(){
  const d={};
  ['model','version','name','config_type','product_name','status','remarks'].forEach(f=>{
    const el=document.getElementById('fe_'+f);if(el)d[f]=el.value;
  });
  return d;
}

async function delConfig(id){if(!PermissionCheck.has('config-lib:delete')){alert('无删除权限');return;}
  if(!confirm('确定删除此配置表？'))return;
  await fetch(API+'/config-sheets/'+id,{method:'DELETE'});loadConfigs(cfgPage);
}

async function batchExport(format){
  const url=format==='pdf'?API+'/batch-export-config?format=pdf':API+'/batch-export-config?format=xlsx';
  try{
    const r=await fetch(url,{method:'POST'});
    if(r.headers.get('content-type')?.includes('json')){
      const d=await r.json();
      alert(d.message||'导出完成');
    }else{
      const blob=await r.blob();
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download=`config_library_export.${format}`;
      a.click();
    }
  }catch(e){alert('导出失败: '+e.message)}
}

loadConfigs(1);loadConfigTypes();
</script>
<script src="brand.js"></script>
<script src="permission-check.js"></script><script>PermissionCheck.init();</script>
<script src="chat-widget.js"></script>
</body></html>
