<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>物料库自检待办</title><link rel="stylesheet" href="common.css">
<style>
.wrap{max-width:1400px;margin:0 auto;padding:18px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.stat-card{background:#fff;border-radius:8px;padding:12px 14px;box-shadow:0 2px 6px rgba(0,0,0,.06);border-left:4px solid #ccc}
.stat-card.crit{border-left-color:#c0392b}
.stat-card.high{border-left-color:#e74c3c}
.stat-card.med{border-left-color:#f39c12}
.stat-card.low{border-left-color:#3498db}
.stat-card.ok{border-left-color:#27ae60}
.stat-num{font-size:24px;font-weight:700;color:#333}
.stat-l{font-size:12px;color:#888;margin-top:2px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.06);margin-bottom:12px}
.toolbar select,.toolbar input{padding:6px 10px;border:1px solid #ddd;border-radius:4px;font-size:13px}
.btn{padding:7px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.b1{background:#667eea;color:#fff}
.b2{background:#27ae60;color:#fff}
.b3{background:#e74c3c;color:#fff}
.b4{background:#f39c12;color:#fff}
.bs{padding:3px 8px;font-size:11px}
.sev{display:inline-block;padding:1px 6px;border-radius:8px;font-size:11px;font-weight:600;color:#fff}
.sev-critical{background:#c0392b}
.sev-high{background:#e74c3c}
.sev-medium{background:#f39c12}
.sev-low{background:#3498db}
.status{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600}
.st-open{background:#fff3cd;color:#856404}
.st-in_progress{background:#cce5ff;color:#004085}
.st-resolved{background:#d4edda;color:#155724}
.st-ignored{background:#f0f0f0;color:#666}
.st-wont_fix{background:#f8d7da;color:#721c24}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
th{background:#f5f6fa;padding:8px;text-align:left;font-weight:600;color:#555;border-bottom:2px solid #eee;white-space:nowrap;position:sticky;top:0;z-index:10}
td{padding:7px 8px;border-bottom:1px solid #f0f0f0;vertical-align:top}
tr:hover td{background:#f8f9ff}
tr.resolved td{opacity:.55}
.batch-bar{display:none;background:#f8f9ff;border:1px solid #d0d7ff;border-radius:6px;padding:8px 12px;margin-bottom:10px;align-items:center;gap:8px;flex-wrap:wrap}
.batch-bar.show{display:flex}
.row-check{width:18px;height:18px;cursor:pointer}
.tbl-wrap{overflow-x:auto;max-height:70vh;overflow-y:auto;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.mo{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:flex-start;padding-top:60px}
.mo.show{display:flex}
.mb{background:#fff;border-radius:12px;padding:20px;width:520px;max-width:95%;max-height:80vh;overflow:auto}
.fg{margin-bottom:10px}.fg label{display:block;font-size:12px;color:#666;margin-bottom:3px}
.fg input,.fg select,.fg textarea{width:100%;padding:6px 8px;border:1px solid #ddd;border-radius:4px;font-size:13px}
.fg textarea{resize:vertical;min-height:60px}
.dash-panel{background:#fff;border-radius:8px;padding:14px;box-shadow:0 2px 6px rgba(0,0,0,.06);margin-bottom:14px}
.rule-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.rule-card{background:#fafbff;padding:8px 10px;border-radius:6px;border:1px solid #e8ebf7;font-size:12px}
.rule-card b{color:#667eea}
</style></head><body>
<div class="sidebar" id="sidebar"></div>
<div class="main-content">
<div class="wrap">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
<h2>物料库自检待办</h2>
<div style="display:flex;gap:8px">
<button class="btn b4" onclick="previewCheck()">👁 试运行（不写库）</button>
<button class="btn b2" onclick="runCheck()">▶ 运行自检</button>
<button class="btn" style="background:#2ecc71;color:#fff" onclick="smartFixAll()">🔧 智能修复</button>
<button class="btn b1" onclick="loadIssues()">刷新</button>
<button class="btn" style="background:#8e44ad;color:#fff" onclick="openRuleEditor()">⚙ 标准配置</button>
<a class="btn bs" href="material.html" style="background:#e8ebf7;color:#444;text-decoration:none">返回物料库</a>
</div>
</div>

<div class="stats-grid" id="statsGrid"></div>

<div class="dash-panel">
<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">
  <div style="font-weight:600;color:#555;font-size:13px">📋 选择本次要执行的检查指令</div>
  <div style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap">
    <button class="btn bs" style="background:#eaf2ff;color:#3b5998" onclick="selectPreset('all')">全选</button>
    <button class="btn bs" style="background:#eaf2ff;color:#3b5998" onclick="selectPreset('enabled')">仅已启用</button>
    <button class="btn bs" style="background:#fff3e0;color:#e67e22" onclick="selectPreset('critical')">仅严重（critical）</button>
    <button class="btn bs" style="background:#e8f5e9;color:#27ae60" onclick="selectPreset('none')">清空</button>
  </div>
</div>
<div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;font-size:12px;color:#666">
  <span style="font-weight:600">快捷分类：</span>
  <label><input type="checkbox" id="cat-code" onchange="applyCategoryFilter()"> 代码 code</label>
  <label><input type="checkbox" id="cat-name" onchange="applyCategoryFilter()"> 名称 name</label>
  <label><input type="checkbox" id="cat-unit" onchange="applyCategoryFilter()"> 单位 unit</label>
  <label><input type="checkbox" id="cat-classification" onchange="applyCategoryFilter()"> 分类 classification</label>
  <label><input type="checkbox" id="cat-bom" onchange="applyCategoryFilter()"> BOM bom</label>
  <label><input type="checkbox" id="cat-integrity" onchange="applyCategoryFilter()"> 完整性 integrity</label>
</div>
<div class="rule-list" id="ruleList"></div>
<div style="margin-top:8px;font-size:12px;color:#888">已选 <b id="selRuleCnt">0</b> / 共 <b id="totalRuleCnt">0</b> 条规则</div>
</div>

<div id="previewResult" style="display:none;margin-bottom:14px"></div>

<div class="toolbar">
<input type="text" id="q" placeholder="搜索代码/描述" style="width:200px" onkeydown="if(event.key==='Enter')loadIssues()">
<select id="fStatus" onchange="loadIssues()">
<option value="">全部状态</option>
<option value="open">待处理</option>
<option value="in_progress">跟进中</option>
<option value="resolved">已解决</option>
<option value="ignored">已忽略</option>
<option value="wont_fix">暂不修复</option>
</select>
<select id="fSev" onchange="loadIssues()">
<option value="">全部严重度</option>
<option value="critical">严重</option>
<option value="high">高</option>
<option value="medium">中</option>
<option value="low">低</option>
</select>
<select id="fRule" onchange="loadIssues()"><option value="">全部规则</option></select>
<button class="btn b1 bs" onclick="loadIssues()">查询</button>
<span style="margin-left:auto;font-size:12px;color:#999">共 <b id="totalN">0</b> 条</span>
</div>

<div class="batch-bar" id="batchBar">
<span style="font-weight:600;color:#667eea">已选 <b id="selN">0</b> 项</span>
<select id="batchStatus" style="padding:4px 8px;border:1px solid #ddd;border-radius:4px">
<option value="">改状态为…</option>
<option value="open">待处理</option>
<option value="in_progress">跟进中</option>
<option value="resolved">已解决</option>
<option value="ignored">已忽略</option>
</select>
<input type="text" id="batchAssignee" placeholder="指派人" style="padding:4px 8px;border:1px solid #ddd;border-radius:4px">
<button class="btn b1 bs" onclick="batchUpdate()">应用</button>
<button class="btn bs" style="background:#eee;color:#666" onclick="clearSel()">取消选择</button>
</div>

<div class="tbl-wrap">
<table><thead><tr>
<th style="width:26px"><input type="checkbox" id="chkAll" onchange="toggleSelAll(this)"></th>
<th style="width:60px">严重度</th>
<th style="width:90px">规则</th>
<th style="width:90px">状态</th>
<th style="width:130px">物料代码</th>
<th>问题描述</th>
<th style="width:200px">整改建议</th>
<th style="width:90px">指派人</th>
<th style="width:90px">截止</th>
<th style="width:140px">发现时间</th>
<th style="width:80px">操作</th>
</tr></thead><tbody id="issTb"><tr><td colspan="11" style="text-align:center;color:#999;padding:30px">加载中…</td></tr></tbody></table>
</div>
<div id="pgBar" style="margin-top:10px;text-align:center"></div>
</div>
</div>

<div class="mo" id="editMo"><div class="mb" id="editMoBody"></div></div>

<script>
const API='/api/material-check';
let allIssues=[];
let page=1; const ps=50;
let allRules=[];

// 错峰定时刷新：基础周期 ± 随机抖动，避免所有定时器在同一秒触发
function staggeredRefresh(fn, baseSec, jitterSec){
  const tick=()=>{
    try{fn()}catch(e){console.error(e)}
    const next=(baseSec+(Math.random()*2-1)*jitterSec)*1000;
    setTimeout(tick,Math.max(2000,next));
  };
  setTimeout(tick, 1500+Math.random()*2500);
}

async function init(){
  document.getElementById('sidebar').innerHTML=window.parent?'':'';
  await loadRules();
  loadIssues();
  loadStats();
  staggeredRefresh(loadStats, 30, 8);
}
async function loadRules(){
  const r=await fetch(API+'/rules'); allRules=await r.json();
  const select=document.getElementById('fRule');
  select.innerHTML='<option value="">全部规则</option>'+(allRules.rules||[]).map(r=>`<option value="${r.id}">${r.id} ${r.name}</option>`).join('');
  const list=document.getElementById('ruleList');
  list.innerHTML=(allRules.rules||[]).map(r=>{
    const isEnabled=r.enabled!==false;
    return `
    <div class="rule-card" data-category="${r.category||''}" data-severity="${r.severity||''}" style="display:flex;align-items:center;gap:6px;padding:6px 8px">
      <input type="checkbox" class="ruleChk" data-id="${r.id}" data-cat="${r.category||''}" data-sev="${r.severity||''}" ${isEnabled?'checked':''} onchange="updateSelCount()" title="勾选后纳入本次自检">
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:6px;font-size:12px">
          <b>${r.id}</b>
          <span class="sev sev-${r.severity||'medium'}" title="严重度">${r.severity||'medium'}</span>
          <span style="color:#888;font-size:11px">${r.category||''}</span>
          ${!isEnabled?'<span style="color:#999;font-size:11px">（已停用）</span>':''}
        </div>
        <div style="margin-top:2px;font-size:12px">${r.name}</div>
        <div style="color:#999;font-size:10px;margin-top:2px">${r.check_type}${r.pattern?' · '+esc(r.pattern.substring(0,40)):''}</div>
      </div>
      <label style="font-size:11px;white-space:nowrap" title="启用/停用规则"><input type="checkbox" ${isEnabled?'checked':''} onchange="toggleRule('${r.id}',this.checked)">${isEnabled?'启用':'停用'}</label>
    </div>`;
  }).join('');
  updateSelCount();
}
async function toggleRule(id,enabled){
  await fetch(API+'/rules/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled})});
  toast('已更新');
}
async function loadStats(){
  try{
    const r=await fetch(API+'/issues/stats'); const d=await r.json();
    const bs=d.byStatus||{},sv=d.bySeverity||{};
    const total=d.total||0;
    const open=bs.open||0,in_progress=bs.in_progress||0,resolved=bs.resolved||0;
    const ignored=bs.ignored||0,wont_fix=bs.wont_fix||0;
    const totalActive=open+in_progress+resolved+ignored+wont_fix;
    const pct = n => totalActive>0 ? Math.round(n/totalActive*100) : 0;
    const crit=sv.critical||0,high=sv.high||0,med=sv.medium||0,low=sv.low||0;
    const last=d.lastRun;
    const lastStr=last?(last.last_run||'未知'):'从未运行';
    let ageStr='从无';
    if(last&&last.last_run){
      const age=Math.round((Date.now()-new Date(last.last_run.replace(/-/g,'/')).getTime())/60000);
      if(age<60)ageStr=age+'分钟前';
      else if(age<1440)ageStr=Math.round(age/60)+'小时前';
      else ageStr=Math.round(age/1440)+'天前';
    }
    document.getElementById('statsGrid').innerHTML=
      '<div style="grid-column:1/-1;font-size:12px;color:#667eea;font-weight:600;margin-top:4px">📊 状态分布（合计 '+totalActive+'）</div>'+
      '<div class="stat-card med" title="尚未开始处理的问题"><div class="stat-num">'+open+'</div><div class="stat-l">待处理 ('+pct(open)+'%)</div></div>'+
      '<div class="stat-card" title="已指派处理人但未完成"><div class="stat-num" style="color:#004085">'+in_progress+'</div><div class="stat-l">跟进中 ('+pct(in_progress)+'%)</div></div>'+
      '<div class="stat-card ok" title="已修复完成"><div class="stat-num" style="color:#155724">'+resolved+'</div><div class="stat-l">已解决 ('+pct(resolved)+'%)</div></div>'+
      '<div class="stat-card" title="忽略（规则不适用等）"><div class="stat-num" style="color:#999">'+ignored+'</div><div class="stat-l">已忽略 ('+pct(ignored)+'%)</div></div>'+
      '<div class="stat-card" title="暂不修复（标记为暂搁）"><div class="stat-num" style="color:#999">'+wont_fix+'</div><div class="stat-l">暂不修 ('+pct(wont_fix)+'%)</div></div>'+
      '<div style="grid-column:1/-1;font-size:12px;color:#667eea;font-weight:600;margin-top:8px">⚠️ 严重度分布（待处理 + 跟进中 共 '+(open+in_progress)+' 条）</div>'+
      '<div class="stat-card crit" title="必须立即处理"><div class="stat-num" style="color:#c0392b">'+crit+'</div><div class="stat-l">严重 critical</div></div>'+
      '<div class="stat-card high" title="需优先处理"><div class="stat-num" style="color:#e74c3c">'+high+'</div><div class="stat-l">高级 high</div></div>'+
      '<div class="stat-card" title="中等优先级"><div class="stat-num" style="color:#f39c12">'+med+'</div><div class="stat-l">中 medium</div></div>'+
      '<div class="stat-card" title="建议改进"><div class="stat-num" style="color:#3498db">'+low+'</div><div class="stat-l">低 low</div></div>'+
      '<div style="grid-column:1/-1;font-size:12px;color:#667eea;font-weight:600;margin-top:8px">⏱ 运行信息</div>'+
      '<div class="stat-card" title="上次自检的物料数量"><div class="stat-num" style="font-size:18px;color:#555">'+(last?(last.materials_scanned||0):'-')+'</div><div class="stat-l">扫描物料数</div></div>'+
      '<div class="stat-card" title="'+lastStr+' ('+ageStr+') — 周期调度已禁用，需手动触发"><div class="stat-num" style="font-size:14px;color:#888">'+lastStr+'</div><div class="stat-l">上次自检 · '+ageStr+'</div></div>'+
      '<div class="stat-card" title="点击「▶ 运行自检」立即触发新一次自检"><div class="stat-num" style="font-size:18px;color:#16a085">▶ 手动</div><div class="stat-l">需手动触发</div></div>';
  }catch(e){console.error(e)}
}
async function loadIssues(){
  const q=document.getElementById('q').value;
  const fStatus=document.getElementById('fStatus').value;
  const fSev=document.getElementById('fSev').value;
  const fRule=document.getElementById('fRule').value;
  const p=new URLSearchParams();
  if(q)p.set('q',q);if(fStatus)p.set('status',fStatus);if(fSev)p.set('severity',fSev);if(fRule)p.set('rule_id',fRule);
  try{
    const r=await fetch(API+'/issues?'+p); const d=await r.json();
    allIssues=d.data||[];
    document.getElementById('totalN').textContent=d.total;
    renderRows();
  }catch(e){console.error(e)}
}
function renderRows(){
  const tbody=document.getElementById('issTb');
  const start=(page-1)*ps,end=start+ps;
  const rows=allIssues.slice(start,end);
  if(!rows.length){tbody.innerHTML='<tr><td colspan="11" style="text-align:center;color:#999;padding:30px">无符合条件的问题</td></tr>';document.getElementById('pgBar').innerHTML='';return}
  tbody.innerHTML=rows.map(i=>{
    const stCls={open:'st-open',in_progress:'st-in_progress',resolved:'st-resolved',ignored:'st-ignored',wont_fix:'st-wont_fix'}[i.status]||'st-open';
    const stLbl={open:'待处理',in_progress:'跟进中',resolved:'已解决',ignored:'已忽略',wont_fix:'暂不修复'}[i.status]||i.status;
    const sel=document.querySelector(`.chk[data-id="${i.id}"]`)?.checked;
    return `<tr class="${i.status==='resolved'?'resolved':''}">
      <td><input type="checkbox" class="chk row-check" data-id="${i.id}" ${sel?'checked':''} onchange="updateSel()"></td>
      <td><span class="sev sev-${i.severity}">${i.severity}</span></td>
      <td><span title="${esc(i.rule_name||'')}" style="cursor:help">${i.rule_id}</span></td>
      <td><span class="status ${stCls}">${stLbl}</span></td>
      <td><b>${esc(i.target_code||'-')}</b></td>
      <td>${esc(i.description||'')}</td>
      <td style="font-size:12px;color:#555">${esc(i.suggested_action||'')}</td>
      <td>${esc(i.assignee||'')}</td>
      <td>${esc((i.due_date||'').substring(0,10)||'')}</td>
      <td style="font-size:11px;color:#999">${esc(i.detected_at||'')}</td>
      <td><button class="btn bs b1" onclick="openEdit(${i.id})">处理</button></td>
    </tr>`;
  }).join('');
  // pagination
  const total=allIssues.length, pages=Math.ceil(total/ps);
  let pg='';
  if(pages>1){
    if(page>1)pg+=`<button class="btn bs" onclick="goPage(${page-1})">上一页</button> `;
    for(let i=Math.max(1,page-3);i<=Math.min(pages,page+3);i++)pg+=`<button class="btn bs ${i===page?'b1':''}" onclick="goPage(${i})">${i}</button> `;
    if(page<pages)pg+=`<button class="btn bs" onclick="goPage(${page+1})">下一页</button>`;
  }
  document.getElementById('pgBar').innerHTML=pg+`<span style="font-size:12px;color:#999;margin-left:12px">第 ${start+1}-${Math.min(end,total)} 条 / 共 ${total} 条</span>`;
}
function goPage(p){page=p;renderRows();}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function updateSel(){
  const ids=[...document.querySelectorAll('.chk:checked')].map(c=>Number(c.dataset.id));
  document.getElementById('selN').textContent=ids.length;
  document.getElementById('batchBar').classList.toggle('show',ids.length>0);
}
function toggleSelAll(cb){document.querySelectorAll('.chk').forEach(c=>c.checked=cb.checked);updateSel();}
function clearSel(){document.querySelectorAll('.chk:checked').forEach(c=>c.checked=false);updateSel();}
async function batchUpdate(){
  const ids=[...document.querySelectorAll('.chk:checked')].map(c=>Number(c.dataset.id));
  if(!ids.length)return;
  const status=document.getElementById('batchStatus').value;
  const assignee=document.getElementById('batchAssignee').value;
  if(!status&&!assignee){toast('请选择状态或指派人');return}
  const r=await fetch(API+'/issues/batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids,status,assignee})});
  const d=await r.json();
  toast(d.message);
  loadIssues();loadStats();
}
function openEdit(id){
  const it=allIssues.find(x=>x.id===id);if(!it)return;
  const body=document.getElementById('editMoBody');
  body.innerHTML=`
    <div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3>处理问题 #${id}</h3><span onclick="closeEdit()" style="cursor:pointer;font-size:22px;color:#999">&times;</span></div>
    <div class="fg"><label>规则</label><div>${esc(it.rule_id)} - ${esc(it.rule_name)}</div></div>
    <div class="fg"><label>物料代码</label><div><b>${esc(it.target_code||'')}</b>（${esc(it.scope||'')}）</div></div>
    <div class="fg"><label>问题描述</label><div>${esc(it.description||'')}</div></div>
    <div class="fg"><label>当前值</label><div style="font-family:monospace;background:#f5f5f5;padding:4px 6px;border-radius:4px">${esc(it.current_value||'(空)')}</div></div>
    <div class="fg"><label>整改建议</label><div style="color:#555">${esc(it.suggested_action||'')}</div></div>
    <div class="fg"><label>状态</label><select id="ed_status"><option value="open" ${it.status==='open'?'selected':''}>待处理</option><option value="in_progress" ${it.status==='in_progress'?'selected':''}>跟进中</option><option value="resolved" ${it.status==='resolved'?'selected':''}>已解决</option><option value="ignored" ${it.status==='ignored'?'selected':''}>已忽略</option><option value="wont_fix" ${it.status==='wont_fix'?'selected':''}>暂不修复</option></select></div>
    <div class="fg"><label>指派人</label><input id="ed_assignee" value="${esc(it.assignee||'')}"></div>
    <div class="fg"><label>截止日期</label><input type="date" id="ed_due" value="${esc((it.due_date||'').substring(0,10)||'')}"></div>
    <div class="fg"><label>处理备注</label><textarea id="ed_notes" placeholder="处理过程、结果或说明">${esc(it.resolution_notes||'')}</textarea></div>
    <div style="text-align:right;margin-top:10px"><button class="btn b2" onclick="saveEdit(${id})">保存</button></div>
  `;
  document.getElementById('editMo').classList.add('show');
}
function closeEdit(){document.getElementById('editMo').classList.remove('show')}
async function saveEdit(id){
  const status=document.getElementById('ed_status').value;
  const assignee=document.getElementById('ed_assignee').value;
  const due_date=document.getElementById('ed_due').value;
  const resolution_notes=document.getElementById('ed_notes').value;
  const r=await fetch(API+'/issues/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,assignee,due_date,resolution_notes})});
  const d=await r.json();
  if(!r.ok){alert(d.error||'保存失败');return}
  toast(d.message);closeEdit();loadIssues();loadStats();
}
function getSelectedRuleIds(){
  const ids=[];
  document.querySelectorAll('.ruleChk:checked').forEach(c=>ids.push(c.dataset.id));
  return ids;
}
function getSelectedCategories(){
  const cats=[];
  document.querySelectorAll('[id^="cat-"]:checked').forEach(c=>cats.push(c.id.replace(/^cat-/,'')));
  return cats;
}
function selectPreset(preset){
  document.querySelectorAll('.ruleChk').forEach(c=>{
    const rule=allRules.rules.find(r=>r.id===c.dataset.id);
    if(!rule)return;
    if(preset==='all')c.checked=true;
    else if(preset==='none')c.checked=false;
    else if(preset==='enabled')c.checked=rule.enabled!==false;
    else if(preset==='critical')c.checked=(rule.severity==='critical');
  });
  updateSelCount();
}
function applyCategoryFilter(){
  const selectedCats=new Set(getSelectedCategories());
  document.querySelectorAll('.ruleChk').forEach(c=>{
    const rule=allRules.rules.find(r=>r.id===c.dataset.id);
    if(!rule)return;
    if(selectedCats.size===0){return} // 全部取消 → 不影响
    c.checked=selectedCats.has(rule.category);
  });
  updateSelCount();
}
function updateSelCount(){
  let n=0;
  document.querySelectorAll('.ruleChk:checked').forEach(()=>n++);
  document.getElementById('selRuleCnt').textContent=n;
  document.getElementById('totalRuleCnt').textContent=(allRules.rules||[]).length;
}
function updateAllRulesCheckboxes(){
  selectPreset('enabled');
}

async function runCheck(){
  const sel=getSelectedRuleIds();
  const cats=getSelectedCategories();
  const summary=sel.length?`已选 ${sel.length} 条规则`:cats.length?`已选分类：${cats.join(', ')}`:'全部规则';
  if(!confirm(`将执行【${summary}】，扫描全部物料与 BOM，可能耗时几十秒。\n注意：仅新增问题或重开已 closed 的问题，不会删除任何记录。\n确定继续？`))return;
  toast('自检中…');
  try{
    const body={};
    if(sel.length)body.rule_ids=sel;
    if(cats.length)body.categories=cats;
    const r=await fetch(API+'/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok){alert(d.error||'自检失败');return}
    toast(d.message);
    loadIssues();loadStats();
  }catch(e){alert('请求失败: '+e.message)}
}

async function previewCheck(){
  const sel=getSelectedRuleIds();
  const cats=getSelectedCategories();
  toast('试运行中…');
  try{
    const body={};
    if(sel.length)body.rule_ids=sel;
    if(cats.length)body.categories=cats;
    const r=await fetch(API+'/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok){alert(d.error||'试运行失败');return}
    showPreviewResult(d);
  }catch(e){alert('请求失败: '+e.message)}
}

function showPreviewResult(d){
  const box=document.getElementById('previewResult');
  if(!box)return;
  const sorted=d.by_rule?Object.entries(d.by_rule).sort((a,b)=>b[1]-a[1]):[];
  const bySev=d.by_severity||{};
  box.innerHTML=`
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#f8f9ff;padding:10px;border-radius:6px;margin-bottom:10px">
      <div style="font-weight:600;color:#27ae60">试运行结果：发现 ${d.total} 个问题（${d.elapsed_ms}ms）</div>
      <span style="color:#888;margin-left:auto">扫描 ${d.materials_scanned} 条物料</span>
    </div>
    <div style="display:flex;gap:12px;font-size:12px;color:#555;margin-bottom:10px;flex-wrap:wrap">
      按严重度：
      ${Object.entries(bySev).map(([k,v])=>`<span class="sev sev-${k}">${k}</span> × ${v}`).join(' ')||'<span style="color:#bbb">无</span>'}
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px">
      ${sorted.map(([id,n])=>{
        const r=(allRules.rules||[]).find(x=>x.id===id)||{};
        return `<div style="background:#fff;border:1px solid #e8ebf7;border-radius:6px;padding:8px 10px">
          <div style="display:flex;justify-content:space-between"><b>${id}</b> <span class="sev sev-${r.severity||'medium'}">${r.severity||'medium'}</span></div>
          <div style="font-size:12px;color:#666;margin-top:2px">${esc(r.name||'')}</div>
          <div style="font-size:14px;font-weight:600;color:#e74c3c;margin-top:4px">${n} 个问题</div>
        </div>`;
      }).join('')}
    </div>
    ${d.preview&&d.preview.length?`
    <details style="margin-top:10px"><summary style="cursor:pointer;color:#667eea;font-weight:600">查看前 ${Math.min(d.preview.length,200)} 条样例</summary>
    <div style="max-height:300px;overflow-y:auto;background:#fafbff;padding:8px;margin-top:6px;font-size:12px;font-family:monospace">
      ${d.preview.slice(0,200).map(p=>`<div style="border-bottom:1px dashed #ddd;padding:4px 0"><b>${p.target_code}</b> · ${p.rule_id} · ${p.severity}<br>${esc(p.description)}</div>`).join('')}
    </div></details>`:''}
  `;
  box.style.display='block';
}
let toastEl=null;
function toast(m){
  if(!toastEl){toastEl=document.createElement('div');toastEl.style.cssText='position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 20px;border-radius:6px;z-index:9999';document.body.appendChild(toastEl)}
  toastEl.textContent=m;toastEl.style.display='block';
  clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.style.display='none',2500);
}

// ==================== 标准配置（规则增删改）====================
function openRuleEditor(){
  const mo=document.createElement('div');
  mo.className='mo show';
  mo.innerHTML=`
  <div class="mb" style="width:900px;max-width:95%">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h3 style="margin:0">⚙ 自检标准配置</h3>
      <div style="display:flex;gap:8px">
        <button class="btn b2 bs" onclick="showRuleForm()">+ 新增规则</button>
        <span class="close-btn" style="cursor:pointer;font-size:22px;color:#999" onclick="this.closest('.mo').remove()">&times;</span>
      </div>
    </div>
    <div id="ruleEditList" style="max-height:60vh;overflow-y:auto"></div>
    <div id="ruleFormBox" style="display:none;margin-top:14px;border-top:2px solid #eee;padding-top:14px"></div>
  </div>`;
  document.body.appendChild(mo);
  renderRuleEditList();
}
function renderRuleEditList(){
  const box=document.getElementById('ruleEditList');
  if(!box)return;
  const rules=(allRules.rules||[]);
  box.innerHTML=`<table style="font-size:12px"><thead><tr>
    <th>ID</th><th>名称</th><th>类别</th><th>严重度</th><th>检查类型</th><th>字段</th><th>自动修复</th><th>启用</th><th>操作</th>
  </tr></thead><tbody>
  ${rules.map(r=>`<tr>
    <td><b>${esc(r.id)}</b></td>
    <td>${esc(r.name||'')}</td>
    <td>${esc(r.category||'')}</td>
    <td><span class="sev sev-${r.severity||'medium'}">${r.severity||'medium'}</span></td>
    <td>${esc(r.check_type||'')}</td>
    <td>${esc(r.field||'-')}</td>
    <td>${r.auto_fix?`<span style="color:#27ae60">${esc(r.auto_fix)}</span>`:'-'}</td>
    <td>${r.enabled!==false?'✅':'❌'}</td>
    <td>
      <button class="btn bs b1" onclick="showRuleForm('${r.id}')">编辑</button>
      <button class="btn bs" style="background:${r.enabled!==false?'#e0e0e0':'#27ae60'};color:${r.enabled!==false?'#666':'#fff'}" onclick="toggleRule('${r.id}',${r.enabled===false})">${r.enabled!==false?'禁用':'启用'}</button>
      <button class="btn bs b3" onclick="deleteRule('${r.id}')">删除</button>
    </td>
  </tr>`).join('')}
  </tbody></table>`;
}
function showRuleForm(id){
  const box=document.getElementById('ruleFormBox');
  if(!box)return;
  const r=id?(allRules.rules||[]).find(x=>x.id===id):{};
  const CHECK_TYPES=['regex','length_range','forbidden_contains','forbidden_chars','forbidden_value','enum','field_present','numeric_gt','field_audit_only','unique','bom_orphan_code'];
  const AUTO_FIXES=['','unify_unit','infer_from_code_segment','infer_from_code','sync_cost_from_bom','rename_by_rule','fill_from_bom','infer_classification','fill_default_unit','auto_complete_name'];
  const CATEGORIES=['code','name','unit','classification','bom','integrity'];
  const SEVERITIES=['critical','high','medium','low'];
  box.style.display='block';
  box.innerHTML=`
    <h4 style="margin:0 0 10px">${id?'编辑规则 '+id:'新增规则'}</h4>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
      <div class="fg"><label>规则ID *</label><input id="rf_id" value="${esc(r.id||'')}" ${id?'disabled':''} placeholder="如 CODE-003"></div>
      <div class="fg"><label>规则名称 *</label><input id="rf_name" value="${esc(r.name||'')}"></div>
      <div class="fg"><label>类别</label><select id="rf_category">${CATEGORIES.map(c=>`<option ${r.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="fg"><label>严重度</label><select id="rf_severity">${SEVERITIES.map(s=>`<option ${r.severity===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="fg"><label>检查类型 *</label><select id="rf_check_type">${CHECK_TYPES.map(c=>`<option ${r.check_type===c?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="fg"><label>检查字段</label><input id="rf_field" value="${esc(r.field||'')}" placeholder="如 material_code, unit"></div>
      <div class="fg"><label>正则/最小值</label><input id="rf_pattern" value="${esc(r.pattern||r.min||'')}" placeholder="正则表达式 或 最小长度"></div>
      <div class="fg"><label>最大值</label><input id="rf_max" value="${esc(r.max||'')}" placeholder="最大长度/数值"></div>
      <div class="fg"><label>允许值(逗号分隔)</label><input id="rf_allowed" value="${esc((r.allowed||[]).join(','))}" placeholder="如 PCS,g,kg"></div>
      <div class="fg"><label>禁止值(逗号分隔)</label><input id="rf_forbidden" value="${esc((r.forbidden||[]).join(','))}" placeholder="如 未确认,待定"></div>
      <div class="fg"><label>自动修复策略</label><select id="rf_auto_fix">${AUTO_FIXES.map(a=>`<option value="${a}" ${r.auto_fix===a?'selected':''}>${a||'无'}</option>`).join('')}</select></div>
      <div class="fg"><label>修复建议</label><input id="rf_remediation" value="${esc(r.remediation||'')}"></div>
    </div>
    <div class="fg"><label>描述</label><input id="rf_description" value="${esc(r.description||'')}"></div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn b2" onclick="saveRuleForm(${id?`'${id}'`:'null'})">保存</button>
      <button class="btn" style="background:#e0e0e0" onclick="document.getElementById('ruleFormBox').style.display='none'">取消</button>
    </div>
  `;
}
async function saveRuleForm(id){
  const body={
    id:document.getElementById('rf_id').value.trim(),
    name:document.getElementById('rf_name').value.trim(),
    category:document.getElementById('rf_category').value,
    severity:document.getElementById('rf_severity').value,
    check_type:document.getElementById('rf_check_type').value,
    field:document.getElementById('rf_field').value.trim(),
    pattern:document.getElementById('rf_pattern').value.trim(),
    max:document.getElementById('rf_max').value.trim()||null,
    allowed:document.getElementById('rf_allowed').value.split(',').map(s=>s.trim()).filter(Boolean),
    forbidden:document.getElementById('rf_forbidden').value.split(',').map(s=>s.trim()).filter(Boolean),
    auto_fix:document.getElementById('rf_auto_fix').value,
    remediation:document.getElementById('rf_remediation').value.trim(),
    description:document.getElementById('rf_description').value.trim()
  };
  if(!body.id||!body.name||!body.check_type){alert('ID、名称、检查类型为必填');return}
  if(body.pattern){const n=Number(body.pattern);if(!isNaN(n))body.min=n;}
  try{
    const url=id?API+'/rules/'+id:API+'/rules';
    const method=id?'PUT':'POST';
    const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok){alert(d.error||'保存失败');return}
    toast(d.message);
    await loadRules();
    renderRuleEditList();
    document.getElementById('ruleFormBox').style.display='none';
  }catch(e){alert('请求失败: '+e.message)}
}
async function toggleRule(id,on){
  try{
    const r=await fetch(API+'/rules/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:on})});
    const d=await r.json();
    if(!r.ok){alert(d.error||'操作失败');return}
    toast(d.message);
    await loadRules();
    renderRuleEditList();
  }catch(e){alert('请求失败: '+e.message)}
}
async function deleteRule(id){
  if(!confirm(`确定删除规则 ${id}？此操作不可撤销。`))return;
  try{
    const r=await fetch(API+'/rules/'+id,{method:'DELETE'});
    const d=await r.json();
    if(!r.ok){alert(d.error||'删除失败');return}
    toast(d.message);
    await loadRules();
    renderRuleEditList();
  }catch(e){alert('请求失败: '+e.message)}
}
async function loadRules(){
  try{
    const r=await fetch(API+'/rules');
    allRules=await r.json();
    renderRules();
  }catch(e){}
}

// ==================== 智能修复（批量执行所有可自动修复的规则）====================
async function smartFixAll(){
  const fixable=(allRules.rules||[]).filter(r=>r.auto_fix&&r.enabled!==false);
  if(!fixable.length){toast('没有可自动修复的规则');return}
  if(!confirm(`将对 ${fixable.length} 条规则执行智能修复，可能修改大量物料数据。\n确定继续？`))return;
  toast('智能修复中…');
  let totalUpdated=0;
  for(const r of fixable){
    try{
      const res=await fetch(API+'/auto-fix',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rule_id:r.id})});
      const d=await res.json();
      if(res.ok&&d.updated)totalUpdated+=d.updated;
    }catch(e){}
  }
  toast(`智能修复完成：共修改 ${totalUpdated} 条物料`);
  loadIssues();loadStats();
}

init();
</script>
