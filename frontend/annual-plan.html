<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>企业经营管理平台（EBMS）-HJ - 年度经营计划</title><link rel="stylesheet" href="common.css">
<style>
.ap-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}.year-box{display:flex;gap:8px;align-items:center}.year-box input{width:100px;padding:8px;border:1px solid #ddd;border-radius:6px}.tabs{display:flex;gap:4px;margin-bottom:14px;overflow-x:auto;border-bottom:2px solid #eee}.tabs button{border:none;background:none;padding:10px 12px;white-space:nowrap;cursor:pointer;color:#666}.tabs button.ac{color:#667eea;border-bottom:2px solid #667eea;font-weight:700}.tc{display:none}.tc.ac{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}.cardx{background:#fff;border-radius:10px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}.cardx .n{font-size:24px;font-weight:800;color:#667eea}.cardx .l{font-size:12px;color:#888;margin-top:4px}.dash{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;margin-bottom:14px}.panel{background:#fff;border-radius:10px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);min-height:180px}.panel h3{font-size:15px;margin-bottom:10px;color:#333}.ring{width:140px;height:140px;border-radius:50%;margin:8px auto;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#333}.bar{height:10px;background:#edf0f7;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#667eea,#27ae60)}.mini-row{display:grid;grid-template-columns:82px 1fr 52px;gap:8px;align-items:center;margin:8px 0;font-size:12px}.trend{display:flex;align-items:flex-end;gap:5px;height:120px}.trend i{flex:1;background:linear-gradient(180deg,#667eea,#9face6);border-radius:4px 4px 0 0;min-height:3px}.sb{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}.sb input,.sb select{padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px}.tbl{overflow:auto;background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);max-height:66vh}.tbl table{width:100%;border-collapse:collapse;font-size:13px}.tbl th{background:#f7f8fb;color:#555;padding:9px;white-space:nowrap;text-align:left;position:sticky;top:0}.tbl td{padding:8px 9px;border-top:1px solid #eee;vertical-align:top}.btn{padding:7px 12px;border:none;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap}.b1{background:#667eea;color:#fff}.b2{background:#27ae60;color:#fff}.b3{background:#e74c3c;color:#fff}.b4{background:#f39c12;color:#fff}.b5{background:#3498db;color:#fff}.bs{padding:4px 8px;font-size:12px}.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px}.green{background:#d4edda;color:#155724}.yellow{background:#fff3cd;color:#856404}.orange{background:#ffe5d0;color:#9a4b00}.red{background:#f8d7da;color:#721c24}.blue{background:#d6e9ff;color:#164b7a}.em{text-align:center;color:#999;padding:28px}.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:flex-start;justify-content:center;padding-top:24px}.mo.ac{display:flex}.mb{background:#fff;border-radius:12px;padding:18px;width:720px;max-width:95%;max-height:90vh;overflow:auto}.fg{margin-bottom:9px}.fg label{display:block;font-size:12px;color:#666;margin-bottom:3px}.fg input,.fg select,.fg textarea{width:100%;padding:7px 8px;border:1px solid #ddd;border-radius:5px}.fg textarea{min-height:72px;resize:vertical}.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ai-box{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ai-box textarea{width:100%;min-height:160px;padding:10px;border:1px solid #ddd;border-radius:8px}.ai-out{background:#fff;border-radius:10px;padding:14px;min-height:200px;white-space:pre-wrap;box-shadow:0 2px 8px rgba(0,0,0,.06)}.timeline{display:flex;gap:8px;overflow-x:auto}.tl{min-width:160px;background:#fff;border-radius:8px;padding:10px;border-left:5px solid #667eea}.kr{margin:2px 0;font-size:12px;color:#555}@media(max-width:1100px){.dash{grid-template-columns:1fr}.ai-box{grid-template-columns:1fr}}
</style></head><body data-page-title="年度经营计划" data-page-perm="annual-plan:view">
<div class="sidebar" id="sidebar"></div>
<div class="main-content" data-module="annual-plan">
  <div class="ap-top">
    <h2>年度经营计划</h2>
    <div class="year-box"><span>年度</span><input id="yearInput" type="number"><button class="btn b1" onclick="reloadCurrent()">刷新</button><button class="btn b5" onclick="openAiTab()" data-perm="annual-plan:analyze">AI分析经营</button></div>
  </div>
  <div class="tabs" id="tabs">
    <button class="ac" onclick="switchTab('dashboard')">经营驾驶舱</button><button onclick="switchTab('goals')">年度经营目标</button><button onclick="switchTab('dept')">部门年度计划</button><button onclick="switchTab('kpis')">经营指标KPI</button><button onclick="switchTab('okrs')">OKR管理</button><button onclick="switchTab('actions')">年度行动计划</button><button onclick="switchTab('projects')">项目计划</button><button onclick="switchTab('risks')">经营风险</button><button onclick="switchTab('analysis')">经营分析</button><button onclick="switchTab('reviews')">年度复盘</button><button onclick="switchTab('ai')">AI经营助手</button>
  </div>
  <div class="tc ac" id="tab-dashboard"><div id="dashboardBox"></div></div>
  <div class="tc" id="tab-goals"><div id="goalsBox"></div></div>
  <div class="tc" id="tab-dept"><div id="deptBox"></div></div>
  <div class="tc" id="tab-kpis"><div id="kpisBox"></div></div>
  <div class="tc" id="tab-okrs"><div id="okrsBox"></div></div>
  <div class="tc" id="tab-actions"><div id="actionsBox"></div></div>
  <div class="tc" id="tab-projects"><div id="projectsBox"></div></div>
  <div class="tc" id="tab-risks"><div id="risksBox"></div></div>
  <div class="tc" id="tab-analysis"><div id="analysisBox"></div></div>
  <div class="tc" id="tab-reviews"><div id="reviewsBox"></div></div>
  <div class="tc" id="tab-ai"><div id="aiBox"></div></div>
</div>
<div class="mo" id="formModal"><div class="mb" id="formBox"></div></div>
<script src="common.js"></script>
<script>
const API='/api/annual-plan';
const depts=['销售部','研发部','采购部','生产部','品质部','财务部','行政部'];
let currentTab='dashboard';
let caches={};
const Y=new Date().getFullYear();
document.getElementById('yearInput').value=Y;
function year(){return Number(document.getElementById('yearInput').value)||Y}
function yuan(v){v=Number(v)||0;return v>=10000?(v/10000).toFixed(1)+'万':Math.round(v).toLocaleString()}
function percent(v){return (Number(v)||0).toFixed(1).replace('.0','')+'%'}
function badge(v){const t=String(v||'-');let c='blue';if(['完成','已完成','关闭','已关闭','绿色','低','低风险'].includes(t))c='green';if(['草稿','执行','未开始','黄色','中','中风险'].includes(t))c='yellow';if(['橙色','高','高风险'].includes(t))c='orange';if(['红色','严重'].includes(t))c='red';return `<span class="badge ${c}">${esc(t)}</span>`}
function applyPerms(){if(window.PermissionCheck)PermissionCheck.applyToPage()}
function switchTab(name){currentTab=name;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('ac',b.textContent.includes(tabName(name))));document.querySelectorAll('.tc').forEach(c=>c.classList.remove('ac'));document.getElementById('tab-'+name).classList.add('ac');loadTab(name)}
function tabName(n){return {dashboard:'经营驾驶舱',goals:'年度经营目标',dept:'部门年度计划',kpis:'经营指标KPI',okrs:'OKR管理',actions:'年度行动计划',projects:'项目计划',risks:'经营风险',analysis:'经营分析',reviews:'年度复盘',ai:'AI经营助手'}[n]}
function reloadCurrent(){loadTab(currentTab,true)}
async function getJson(url,opt){const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'请求失败');return j}
async function loadTab(name,force){if(name==='dashboard')return loadDashboard();if(name==='analysis')return loadAnalysis();if(name==='ai')return loadAi();if(name==='projects')return loadProjects();const cfg=configs[name];if(cfg)return loadResource(name,force)}
function openAiTab(){switchTab('ai');setTimeout(()=>document.getElementById('aiQuestion')?.focus(),50)}
async function loadDashboard(){const d=await getJson(`${API}/dashboard?year=${year()}`);const max=Math.max(1,...(d.monthly_sales||[]).map(x=>x.sales_amount));const comp=Math.min(100,Number(d.goal_completion_rate)||0);document.getElementById('dashboardBox').innerHTML=`
<div class="grid"><div class="cardx"><div class="n">${percent(d.goal_completion_rate)}</div><div class="l">经营完成率</div></div><div class="cardx"><div class="n">${yuan(d.sales_amount)}</div><div class="l">销售额</div></div><div class="cardx"><div class="n">${percent(d.profit_rate)}</div><div class="l">利润率</div></div><div class="cardx"><div class="n">${percent(d.order_completion_rate)}</div><div class="l">订单完成率</div></div><div class="cardx"><div class="n">${d.project_count||0}</div><div class="l">新品研发</div></div><div class="cardx"><div class="n">${yuan(d.inventory_value)}</div><div class="l">库存价值</div></div><div class="cardx"><div class="n">${d.ai_score}</div><div class="l">AI经营评分</div></div><div class="cardx"><div class="n">${d.risk_count}</div><div class="l">经营风险</div></div></div>
<div class="dash"><div class="panel"><h3>${year()}年度经营完成率</h3><div class="ring" style="background:conic-gradient(#667eea ${comp*3.6}deg,#edf0f7 0)"><div style="background:white;width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center">${Math.round(comp)}%</div></div></div><div class="panel"><h3>销售趋势</h3><div class="trend">${(d.monthly_sales||[]).map(m=>`<i title="${m.month}月 ${yuan(m.sales_amount)}" style="height:${Math.max(3,m.sales_amount/max*115)}px"></i>`).join('')}</div></div><div class="panel"><h3>利润趋势</h3><div class="trend">${(d.monthly_sales||[]).map(m=>`<i title="${m.month}月 ${yuan(m.profit_amount)}" style="height:${Math.max(3,m.profit_amount/(max*.18||1)*115)}px;background:linear-gradient(180deg,#27ae60,#b5e7c6)"></i>`).join('')}</div></div></div>
<div class="dash"><div class="panel"><h3>部门完成率</h3>${(d.department_completion||[]).map(x=>`<div class="mini-row"><span>${x.department}</span><div class="bar"><i style="width:${Math.min(100,Number(x.completion_rate)||0)}%"></i></div><b>${percent(x.completion_rate)}</b></div>`).join('')}</div><div class="panel"><h3>库存变化</h3><div class="trend">${(d.monthly_inventory||[]).map((m,i)=>`<i title="${i+1}月 ${yuan(m.value)}" style="height:${Math.max(12,m.value/Math.max(1,d.inventory_value)*110)}px;background:linear-gradient(180deg,#3498db,#d6e9ff)"></i>`).join('')}</div></div><div class="panel"><h3>AI建议</h3><ul style="padding-left:18px;line-height:1.9">${(d.suggestions||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>`}
const configs={
 goals:{box:'goalsBox',endpoint:'goals',title:'年度经营目标',cols:[['年度',r=>r.year],['目标名称',r=>r.goal_name],['类型',r=>r.goal_type],['目标值',r=>`${r.target_value||0}${r.unit||''}`],['实际值',r=>r.actual_value||0],['负责人',r=>r.owner],['权重',r=>r.weight],['周期',r=>(r.start_date||'')+' ~ '+(r.end_date||'')],['状态',r=>badge(r.status)],['操作',r=>ops('goals',r)]],fields:[['year','年度','number'],['goal_name','经营目标名称','text'],['goal_type','目标类型','select','销售,利润,订单,研发,采购,生产,品质'],['target_value','目标值','number'],['actual_value','实际值','number'],['unit','单位','select','万元,%,件,项'],['owner','负责人','text'],['weight','权重','number'],['start_date','开始日期','date'],['end_date','结束日期','date'],['status','状态','select','草稿,执行,完成']]},
 dept:{box:'deptBox',endpoint:'department-plans',title:'部门年度计划',cols:[['部门',r=>r.department],['计划名称',r=>r.plan_name],['目标',r=>`${r.target_value||0}${r.unit||''}`],['实际',r=>r.actual_value||0],['完成率',r=>percent(r.completion_rate)],['负责人',r=>r.owner],['重点行动',r=>esc(r.key_actions||'')],['状态',r=>badge(r.status)],['操作',r=>ops('dept',r)]],fields:[['year','年度','number'],['department','部门','select',depts.join(',')],['plan_name','计划名称','text'],['target_value','目标值','number'],['actual_value','实际值','number'],['unit','单位','text'],['owner','负责人','text'],['weight','权重','number'],['completion_rate','完成率','number'],['key_actions','重点行动','textarea'],['risks','风险','textarea'],['status','状态','select','草稿,执行,完成']]},
 kpis:{box:'kpisBox',endpoint:'kpis',title:'经营指标(KPI)',cols:[['KPI名称',r=>r.kpi_name],['部门',r=>r.department],['负责人',r=>r.owner],['目标值',r=>r.target_value],['实际值',r=>r.actual_value],['完成率',r=>percent(r.completion_rate)],['权重',r=>r.weight],['得分',r=>r.score],['状态',r=>badge(r.status)],['操作',r=>`<button class="btn bs b5" onclick="scoreKpi(${r.id})" data-perm="annual-plan:edit">评分</button> `+ops('kpis',r)]],fields:[['year','年度','number'],['kpi_name','KPI名称','text'],['department','所属部门','select',depts.join(',')],['owner','负责人','text'],['target_value','目标值','number'],['actual_value','实际值','number'],['unit','单位','text'],['weight','权重','number'],['status','状态','select','草稿,执行,完成']]},
 okrs:{box:'okrsBox',endpoint:'okrs',title:'OKR管理',cols:[['目标',r=>r.objective],['部门',r=>r.department],['负责人',r=>r.owner],['关键结果',r=>(r.key_results||[]).map(k=>`<div class="kr">${esc(k.name)}：${esc(k.target)}</div>`).join('')],['进度',r=>percent(r.progress)],['状态',r=>badge(r.status)],['操作',r=>ops('okrs',r)]],fields:[['year','年度','number'],['department','部门','select',depts.join(',')],['owner','负责人','text'],['objective','目标O','text'],['key_results','关键结果KR（每行一条）','textarea'],['progress','进度','number'],['status','状态','select','草稿,执行,完成']]},
 actions:{box:'actionsBox',endpoint:'action-plans',title:'年度行动计划',cols:[['计划名称',r=>r.plan_name],['部门',r=>r.department],['负责人',r=>r.owner],['时间',r=>(r.start_date||'')+' ~ '+(r.end_date||'')],['完成率',r=>percent(r.completion_rate)],['优先级',r=>r.priority],['风险',r=>badge(r.risk_level)],['状态',r=>badge(r.status)],['操作',r=>ops('actions',r)]],fields:[['year','年度','number'],['plan_name','计划名称','text'],['department','所属部门','select',depts.join(',')],['owner','负责人','text'],['start_date','开始时间','date'],['end_date','结束时间','date'],['completion_rate','完成率','number'],['priority','优先级','select','高,中,低'],['risk_level','风险等级','select','绿色,黄色,橙色,红色'],['milestone','里程碑','text'],['depends_on','依赖关系','text'],['status','状态','select','未开始,执行,完成,暂停']]},
 risks:{box:'risksBox',endpoint:'risks',title:'经营风险',cols:[['风险名称',r=>r.risk_name],['类型',r=>r.type],['等级',r=>badge(r.level)],['概率',r=>r.probability],['影响',r=>r.impact],['责任人',r=>r.owner],['措施',r=>esc(r.measures||'')],['状态',r=>badge(r.status)],['操作',r=>ops('risks',r)]],fields:[['year','年度','number'],['risk_name','风险名称','text'],['type','风险类型','select','销售,采购,研发,库存,资金,生产,品质'],['level','等级','select','绿色,黄色,橙色,红色'],['probability','概率','number'],['impact','影响','number'],['owner','责任人','text'],['measures','措施','textarea'],['status','状态','select','未处理,处理中,已关闭']]},
 reviews:{box:'reviewsBox',endpoint:'reviews',title:'年度复盘',cols:[['年度',r=>r.year],['经营总结',r=>esc(r.summary||'')],['目标完成率',r=>percent(r.completion_rate)],['优秀部门',r=>r.best_departments],['不足',r=>esc(r.problems||'')],['改善计划',r=>esc(r.improvement_plan||'')],['状态',r=>badge(r.status)],['操作',r=>ops('reviews',r)]],fields:[['year','年度','number'],['summary','经营总结','textarea'],['completion_rate','目标完成率','number'],['best_departments','优秀部门','text'],['problems','不足','textarea'],['improvement_plan','改善计划','textarea'],['next_year_goals','明年目标','textarea'],['attachments','附件/照片/PPT链接','textarea'],['meeting_notes','会议纪要','textarea'],['status','状态','select','草稿,确认,归档']]}
};
function resourceToolbar(name){const cfg=configs[name];let extra='';if(name==='goals')extra=`<button class="btn b4" onclick="copyGoals()" data-perm="annual-plan:create">复制上一年度</button>`;return `<div class="sb"><input id="${name}Kw" placeholder="搜索${cfg.title}" onkeydown="if(event.key==='Enter')loadResource('${name}',true)"><button class="btn b1" onclick="loadResource('${name}',true)">查询</button><button class="btn b2" onclick="openAdd('${name}')" data-perm="annual-plan:create">新增</button><button class="btn b5" onclick="exportResource('${name}')" data-perm="annual-plan:export">导出CSV</button>${extra}<span style="margin-left:auto">共 <b id="${name}Tc">0</b> 条</span></div>`}
async function loadResource(name,force){const cfg=configs[name];const kw=document.getElementById(name+'Kw')?.value||'';const j=await getJson(`${API}/${cfg.endpoint}?year=${year()}&limit=200&keyword=${encodeURIComponent(kw)}`);caches[name]=j.data||[];document.getElementById(cfg.box).innerHTML=resourceToolbar(name)+renderTable(cfg.cols,caches[name],cfg.cols.length);document.getElementById(name+'Tc').textContent=j.total||0;applyPerms()}
function renderTable(cols,rows,span){if(!rows.length)return `<div class="tbl"><table><tbody><tr><td class="em" colspan="${span}">暂无数据</td></tr></tbody></table></div>`;return `<div class="tbl"><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)??''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function ops(name,r){return `<button class="btn bs b4" onclick="openEdit('${name}',${r.id})" data-perm="annual-plan:edit">编辑</button> <button class="btn bs b3" onclick="delResource('${name}',${r.id})" data-perm="annual-plan:delete">删除</button>`}
function openAdd(name){openForm('新增'+configs[name].title,name,Object.assign({year:year()},{}))}
function openEdit(name,id){const row=(caches[name]||[]).find(x=>x.id===id);if(row)openForm('编辑'+configs[name].title,name,row)}
function openForm(title,name,row){const cfg=configs[name],box=document.getElementById('formBox');let h=`<div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3>${title}</h3><span onclick="closeForm()" style="cursor:pointer;font-size:24px;color:#999">&times;</span></div>`;h+='<div>';for(let i=0;i<cfg.fields.length;i++){const a=cfg.fields[i],b=cfg.fields[i+1];if(a[2]==='textarea'){h+=field(a,row);continue}if(b&&b[2]!=='textarea'){h+='<div class="fr">'+field(a,row)+field(b,row)+'</div>';i++}else h+='<div class="fr">'+field(a,row)+'</div>'}h+=`</div><div style="text-align:right;margin-top:12px"><button class="btn b2" onclick="saveForm('${name}',${row.id||0})">保存</button></div>`;box.innerHTML=h;document.getElementById('formModal').classList.add('ac')}
function field(f,row){let [k,l,t,opt]=f;let v=row[k]??'';if(k==='key_results'&&Array.isArray(row.key_results))v=row.key_results.map(x=>x.target||x.name||'').join('\n');if(t==='select'){const arr=String(opt||'').split(',');return `<div class="fg"><label>${l}</label><select id="ff_${k}">${arr.map(o=>`<option value="${esc(o)}" ${v==o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}if(t==='textarea')return `<div class="fg"><label>${l}</label><textarea id="ff_${k}">${esc(v)}</textarea></div>`;return `<div class="fg"><label>${l}</label><input id="ff_${k}" type="${t==='number'?'number':t==='date'?'date':'text'}" value="${esc(v)}"></div>`}
async function saveForm(name,id){const cfg=configs[name],data={};cfg.fields.forEach(f=>{const el=document.getElementById('ff_'+f[0]);if(el)data[f[0]]=f[2]==='number'?Number(el.value)||0:el.value});const url=`${API}/${cfg.endpoint}${id?'/'+id:''}`;await getJson(url,{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});closeForm();loadResource(name,true);if(name==='goals'||name==='kpis'||name==='actions'||name==='risks')loadDashboard()}
function closeForm(){document.getElementById('formModal').classList.remove('ac')}
async function delResource(name,id){if(!confirm('确定删除？'))return;await getJson(`${API}/${configs[name].endpoint}/${id}`,{method:'DELETE'});loadResource(name,true)}
async function scoreKpi(id){await getJson(`${API}/kpis/${id}/score`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});loadResource('kpis',true)}
async function copyGoals(){const from=year()-1;if(!confirm(`复制${from}年度目标到${year()}年度？`))return;const j=await getJson(`${API}/goals/copy-previous-year`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from_year:from,to_year:year()})});alert('已复制 '+(j.copied||0)+' 条');loadResource('goals',true)}
async function exportResource(name){const cfg=configs[name],list=(await getJson(`${API}/${cfg.endpoint}?year=${year()}&limit=9999`)).data||[];if(!list.length)return alert('暂无数据');const heads=cfg.cols.filter(c=>c[0]!=='操作').map(c=>c[0]);let csv='\uFEFF'+heads.join(',')+'\n';list.forEach(r=>{csv+=cfg.cols.filter(c=>c[0]!=='操作').map(c=>String(c[1](r)).replace(/<[^>]*>/g,'').replace(/,/g,'，')).join(',')+'\n'});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=cfg.title+'_'+year()+'.csv';a.click()}
async function loadProjects(){const kw=document.getElementById('projectKw')?.value||'';const j=await getJson(`${API}/project-plans?year=${year()}&limit=200&keyword=${encodeURIComponent(kw)}`);const cols=[['项目编号',r=>r.project_no],['项目名称',r=>r.project_name],['负责人',r=>r.owner],['进度',r=>percent(r.progress)],['预算',r=>yuan(r.budget)],['阶段',r=>r.stage],['风险',r=>badge(r.risk)],['状态',r=>badge(r.status)],['订单额',r=>yuan(r.order_amount)]];document.getElementById('projectsBox').innerHTML=`<div class="sb"><input id="projectKw" placeholder="搜索项目" onkeydown="if(event.key==='Enter')loadProjects()"><button class="btn b1" onclick="loadProjects()">查询</button><span style="margin-left:auto">来自项目模块，无需重复录入</span></div>`+renderTable(cols,j.data||[],cols.length)}
async function loadAnalysis(){const [m,q,r]=await Promise.all([getJson(`${API}/monthly-analysis?year=${year()}`),getJson(`${API}/quarterly-analysis?year=${year()}`),getJson(`${API}/reports/annual?year=${year()}`)]);const mc=[['月份',x=>x.month+'月'],['销售额',x=>yuan(x.sales_amount)],['利润',x=>yuan(x.profit_amount)],['订单',x=>x.order_count],['库存',x=>yuan(x.inventory_value)],['品质',x=>percent(x.quality_rate)],['AI摘要',x=>esc(x.summary)]];const qc=[['季度',x=>x.quarter],['销售额',x=>yuan(x.sales_amount)],['利润',x=>yuan(x.profit_amount)],['订单',x=>x.order_count],['环比',x=>percent(x.qoq_rate)],['预测年化',x=>yuan(x.forecast)],['趋势',x=>x.trend]];document.getElementById('analysisBox').innerHTML=`<div class="panel"><h3>${r.title}</h3><p style="line-height:1.8">${esc(r.summary)}</p><ul style="padding-left:18px;line-height:1.8">${(r.suggestions||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><h3 style="margin:14px 0 8px">月度经营分析</h3>${renderTable(mc,m.data||[],mc.length)}<h3 style="margin:14px 0 8px">季度经营分析</h3>${renderTable(qc,q.data||[],qc.length)}`}
function loadAi(){document.getElementById('aiBox').innerHTML=`<div class="ai-box"><div><textarea id="aiQuestion" placeholder="输入：分析今年经营情况">分析今年经营情况</textarea><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn b1" onclick="aiAnalyze()" data-perm="annual-plan:analyze">AI分析经营</button>${['OKR','KPI','年度计划','周计划','会议纪要','经营报告','风险预测'].map(t=>`<button class="btn b5" onclick="aiGenerate('${t}')" data-perm="annual-plan:analyze">生成${t}</button>`).join('')}</div></div><div class="ai-out" id="aiOut">等待分析...</div></div>`;applyPerms()}
async function aiAnalyze(){const q=document.getElementById('aiQuestion').value;const j=await getJson(`${API}/ai/analyze`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({year:year(),question:q})});document.getElementById('aiOut').textContent=j.answer||''}
async function aiGenerate(type){const j=await getJson(`${API}/ai/generate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({year:year(),type})});document.getElementById('aiOut').textContent=j.content||''}
window.onclick=e=>{if(e.target.id==='formModal')closeForm()};
loadDashboard();
</script>
